name: PADOKA Dependency Security

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 2'
  push:
    paths:
      - '.github/workflows/dependency-security.yml'
      - 'vendor/SHA256SUMS'
      - '.github/workflows/vendor-browser-dependencies.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: padoka-dependency-security
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify exact dependency security
        id: dependency_audit
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null
          npm install --ignore-scripts --package-lock-only @supabase/supabase-js@2.112.4 html5-qrcode@2.3.8
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm audit signatures

      - name: Open dependency security incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="PADOKA alerta de segurança em dependências"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY"               --title "$title"               --body "A verificação automática de vulnerabilidades/assinaturas das dependências do navegador falhou. Revise o workflow **PADOKA Dependency Security** antes de atualizar os arquivos vendorizados."
          else
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "A verificação semanal de dependências continua falhando."
          fi

      - name: Close recovered dependency incident
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="PADOKA alerta de segurança em dependências"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "✅ Dependências voltaram a passar na auditoria de vulnerabilidades e assinaturas."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
          fi
