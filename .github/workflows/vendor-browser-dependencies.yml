name: Vendor Browser Dependencies

on:
  push:
    paths:
      - '.github/workflows/vendor-browser-dependencies.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-browser-dependencies
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Vendor exact browser packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/padoka-vendor
          mkdir -p /tmp/padoka-vendor/supabase /tmp/padoka-vendor/qr vendor

          npm pack @supabase/supabase-js@2.112.4 --pack-destination /tmp/padoka-vendor >/tmp/supabase-pack.txt
          SUPA_TGZ="/tmp/padoka-vendor/$(tail -n1 /tmp/supabase-pack.txt)"
          tar -xzf "$SUPA_TGZ" -C /tmp/padoka-vendor/supabase
          SUPA_JS="$(find /tmp/padoka-vendor/supabase -type f \( -path '*/dist/umd/supabase.js' -o -path '*/dist/umd/supabase.min.js' \) | head -n1)"
          test -n "$SUPA_JS"
          cp "$SUPA_JS" vendor/supabase-js-2.112.4.js

          npm pack html5-qrcode@2.3.8 --pack-destination /tmp/padoka-vendor >/tmp/qr-pack.txt
          QR_TGZ="/tmp/padoka-vendor/$(tail -n1 /tmp/qr-pack.txt)"
          tar -xzf "$QR_TGZ" -C /tmp/padoka-vendor/qr
          QR_JS="$(find /tmp/padoka-vendor/qr -type f -name 'html5-qrcode.js' | head -n1)"
          test -n "$QR_JS"
          cp "$QR_JS" vendor/html5-qrcode-2.3.8.js

          {
            echo "PADOKA browser dependency lock"
            echo "Generated from exact npm package versions."
            echo
            sha256sum vendor/supabase-js-2.112.4.js
            sha256sum vendor/html5-qrcode-2.3.8.js
          } > vendor/SHA256SUMS

          test -s vendor/supabase-js-2.112.4.js
          test -s vendor/html5-qrcode-2.3.8.js

      - name: Generate PWA PNG icons
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends librsvg2-bin
          fi
          rsvg-convert -w 192 -h 192 assets/logo-padoka.svg > assets/icon-192.png
          rsvg-convert -w 512 -h 512 assets/logo-padoka.svg > assets/icon-512.png
          test -s assets/icon-192.png
          test -s assets/icon-512.png

      - name: Commit vendored dependencies and icons
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- vendor/ assets/icon-192.png assets/icon-512.png && git ls-files --error-unmatch vendor/SHA256SUMS >/dev/null 2>&1 && git ls-files --error-unmatch assets/icon-192.png >/dev/null 2>&1 && git ls-files --error-unmatch assets/icon-512.png >/dev/null 2>&1; then
            echo "Vendored dependencies and PWA icons already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/ assets/icon-192.png assets/icon-512.png
          git commit -m "build: vendor exact browser dependencies and PWA icons"
          git push
