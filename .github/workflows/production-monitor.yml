name: PADOKA Production Monitor

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/production-monitor.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: padoka-production-monitor
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production surfaces
        shell: bash
        run: |
          set +e
          BASE="https://lucasjanoca.github.io/padoka-da-villa"
          PUSH="https://yncspxfsvlqdnodlsosb.supabase.co/functions/v1/padoka-push"
          FAILED=0

          check() {
            local url="$1"
            local marker="$2"
            local name="$3"
            local body
            body="$(curl --location --silent --show-error --fail --max-time 20 "$url")"
            local rc=$?
            if [ "$rc" -ne 0 ] || ! printf '%s' "$body" | grep -Fq "$marker"; then
              echo "::error::$name falhou: $url"
              FAILED=1
            else
              echo "OK: $name"
            fi
          }

          check_status() {
            local url="$1"
            local name="$2"
            local code
            code="$(curl --location --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$url")"
            if [ "$code" != "200" ]; then
              echo "::error::$name retornou HTTP $code: $url"
              FAILED=1
            else
              echo "OK: $name"
            fi
          }

          check "$BASE/" "assets/padoka-pwa.js?v=3" "Home"
          check "$BASE/produto.html" "PADOKA" "Produto"
          check "$BASE/conta.html" "customer-notifications.js" "Conta"
          check "$BASE/acompanhamento.html" "customer-notifications.js" "Acompanhamento"
          check "$BASE/pagamento.html" "PADOKA" "Pagamento"
          check "$BASE/pdv.html" "vendor/html5-qrcode-2.3.8.js" "PDV scanner local"
          check "$BASE/vendor/supabase-js-2.112.4.js" "var supabase=" "Supabase JS local"
          check "$BASE/vendor/html5-qrcode-2.3.8.js" "Html5Qrcode" "Scanner local"
          check "$BASE/vendor/SHA256SUMS" "f8ce7fab799af1916019cbd0b485b39bb80dbdbc6dc062909a751c9e5198e04c" "Vendor lock"
          check_status "$BASE/assets/icon-192.png" "PWA icon 192"
          check_status "$BASE/assets/icon-512.png" "PWA icon 512"
          check "$BASE/assets/runtime-security.css" ".padoka-orders-auth-transition" "CSS de segurança"
          check "$BASE/manifest.webmanifest" "\"display\": \"standalone\"" "Manifest PWA"
          check "$BASE/manifest.webmanifest" "assets/icon-192.png" "Manifest icon 192"
          check "$BASE/manifest.webmanifest" "assets/icon-512.png" "Manifest icon 512"
          check "$BASE/service-worker.js" "padoka-pwa-v5" "Service Worker"
          check "$BASE/.well-known/security.txt" "security/advisories/new" "security.txt"
          check "https://yncspxfsvlqdnodlsosb.supabase.co/functions/v1/padoka-public-config" "publishableKey" "Config pública"
          check "$PUSH?action=config" "publicKey" "Push config"

          HOME="$(curl --location --silent --show-error --fail --max-time 20 "$BASE/")"
          if printf '%s' "$HOME" | grep -Eq "script-src[^;]*'unsafe-inline'"; then
            echo "::error::CSP voltou a permitir unsafe-inline em script-src"
            FAILED=1
          else
            echo "OK: script-src sem unsafe-inline"
          fi
          if printf '%s' "$HOME" | grep -Eq "script-src[^;]*https?://"; then
            echo "::error::script-src contém origem remota"
            FAILED=1
          else
            echo "OK: script-src apenas local + hashes"
          fi
          if ! printf '%s' "$HOME" | grep -Fq "style-src-attr 'none'"; then
            echo "::error::Home perdeu bloqueio de style attributes"
            FAILED=1
          else
            echo "OK: style-src-attr bloqueado na Home"
          fi

          code="$(curl --silent --show-error --max-time 20 -o /tmp/push-auth.json -w '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            --data '{"action":"subscribe","subscription":{}}' "$PUSH")"
          if [ "$code" != "401" ]; then
            echo "::error::Push sem sessão retornou HTTP $code; esperado 401"
            cat /tmp/push-auth.json || true
            FAILED=1
          else
            echo "OK: Push exige autenticação"
          fi

          payload="$(python3 -c 'import json; print(json.dumps({"action":"subscribe","pad":"x"*17000}))')"
          code="$(curl --silent --show-error --max-time 20 -o /tmp/push-size.json -w '%{http_code}' \
            -X POST -H 'content-type: application/json' --data "$payload" "$PUSH")"
          if [ "$code" != "413" ]; then
            echo "::error::Push payload grande retornou HTTP $code; esperado 413"
            cat /tmp/push-size.json || true
            FAILED=1
          else
            echo "OK: Push limita payload"
          fi

          exit "$FAILED"

      - name: Open production incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="PADOKA produção indisponível"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "O monitor automático detectou uma falha de disponibilidade ou segurança em produção. Consulte a execução do workflow **PADOKA Production Monitor**."
          else
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "A falha continua presente em uma nova verificação automática."
          fi

      - name: Close recovered incident
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="PADOKA produção indisponível"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "✅ Produção recuperada. Todos os smoke tests voltaram a passar."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
          fi
