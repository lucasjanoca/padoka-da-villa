name: PADOKA Static Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Check all audit scripts syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.mjs; do
            echo "Syntax: $file"
            node --check "$file"
          done

      - name: Check internal extension syntax
        run: |
          node --check assets/staff-audit.js
          node --check assets/product-management.js
          node --check assets/pdv-idempotency.js
          node --check assets/pdv-scanner-fix.js
          node --check assets/orders-auth-lifecycle.js
          node --check assets/app-runtime.js
          node --check assets/padoka-pwa.js
          node --check assets/account.js
          node --check assets/club.js

      - name: Run every PADOKA audit
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.mjs; do
            if [ "$file" = "tests/e2e-browser-smoke.mjs" ]; then
              echo "Skipping $file here; PADOKA Browser E2E installs pinned Playwright and runs it after deploy."
              continue
            fi
            echo ""
            echo "=== Running $file ==="
            node "$file"
          done
