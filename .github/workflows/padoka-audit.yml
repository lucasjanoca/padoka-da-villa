name: PADOKA Static Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Check all audit scripts syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.mjs; do
            echo "Syntax: $file"
            node --check "$file"
          done

      - name: Check internal extension syntax
        run: |
          node --check assets/staff-audit.js
          node --check assets/product-management.js
          node --check assets/pdv-idempotency.js
          node --check assets/pdv-scanner-fix.js
          node --check assets/orders-auth-lifecycle.js

      - name: Run every PADOKA audit
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.mjs; do
            echo ""
            echo "=== Running $file ==="
            node "$file"
          done
