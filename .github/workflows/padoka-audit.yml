name: PADOKA Static Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check audit scripts syntax
        run: |
          node --check tests/static-audit.mjs
          node --check tests/operational-inventory-audit.mjs
          node --check tests/production-transaction-audit.mjs
          node --check tests/production-frontend-audit.mjs
          node --check tests/loss-transaction-audit.mjs
          node --check tests/reporting-rpc-audit.mjs
          node --check tests/reporting-frontend-audit.mjs
          node --check tests/settings-sync-audit.mjs
          node --check tests/pdv-idempotency-audit.mjs
          node --check tests/admin-dashboard-audit.mjs
          node --check tests/order-idempotency-audit.mjs
          node --check tests/pdv-sale-void-audit.mjs
          node --check tests/migration-chain-audit.mjs
          node --check tests/profile-onboarding-audit.mjs

      - name: Run PADOKA static audit
        run: node tests/static-audit.mjs

      - name: Run migration chain audit
        run: node tests/migration-chain-audit.mjs

      - name: Run profile onboarding audit
        run: node tests/profile-onboarding-audit.mjs

      - name: Run inventory metadata audit
        run: node tests/operational-inventory-audit.mjs

      - name: Run production transaction audit
        run: node tests/production-transaction-audit.mjs

      - name: Run production frontend audit
        run: node tests/production-frontend-audit.mjs

      - name: Run loss transaction audit
        run: node tests/loss-transaction-audit.mjs

      - name: Run reporting RPC audit
        run: node tests/reporting-rpc-audit.mjs

      - name: Run reporting frontend audit
        run: node tests/reporting-frontend-audit.mjs

      - name: Run settings sync audit
        run: node tests/settings-sync-audit.mjs

      - name: Run PDV idempotency audit
        run: node tests/pdv-idempotency-audit.mjs

      - name: Run admin dashboard audit
        run: node tests/admin-dashboard-audit.mjs

      - name: Run checkout idempotency audit
        run: node tests/order-idempotency-audit.mjs

      - name: Run PDV sale void audit
        run: node tests/pdv-sale-void-audit.mjs
