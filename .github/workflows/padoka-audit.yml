name: PADOKA Static Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Check all audit scripts syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.mjs; do
            echo "Syntax: $file"
            node --check "$file"
          done

      - name: Check critical runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            assets/app-runtime.js \
            assets/account.js \
            assets/checkout-page.js \
            assets/checkout-recovery.js \
            assets/orders-auth-lifecycle.js \
            assets/internal-nav.js \
            assets/operational-sync.js \
            assets/loss-registration.js \
            assets/staff-audit.js \
            assets/product-management.js \
            assets/pdv-idempotency.js \
            assets/pdv-scanner-fix.js \
            assets/padoka-pwa.js \
            assets/club.js; do
            echo "Syntax: $file"
            node --check "$file"
          done

      - name: Run every PADOKA audit
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.mjs; do
            if [ "$file" = "tests/e2e-browser-smoke.mjs" ]; then
              echo "Skipping $file here; PADOKA Browser E2E installs pinned Playwright and runs it after deploy."
              continue
            fi
            echo ""
            echo "=== Running $file ==="
            node "$file"
          done
