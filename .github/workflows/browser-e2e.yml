name: PADOKA Browser E2E

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed
  schedule:
    - cron: '37 7 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: padoka-browser-e2e
  cancel-in-progress: true

jobs:
  browser:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pinned Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install --package-lock-only --ignore-scripts --save-dev playwright@1.62.1
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm audit signatures
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run browser smoke
        env:
          BASE_URL: https://lucasjanoca.github.io/padoka-da-villa
        run: node tests/e2e-browser-smoke.mjs

      - name: Open E2E incident
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="PADOKA E2E de produção falhou"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "O teste real de navegador da PADOKA falhou. Consulte o workflow **PADOKA Browser E2E**."
          else
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "O teste E2E continua falhando."
          fi

      - name: Close recovered E2E incident
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="PADOKA E2E de produção falhou"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "✅ O teste real de navegador voltou a passar."
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
          fi
