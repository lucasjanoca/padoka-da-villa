<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15120f"><title>Acompanhar pedido • PADOKA DA VILLA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f5efe7;--paper:#fffdf9;--ink:#17130f;--muted:#776e65;--line:#e7dbcf;--dark:#15120f;--brand:#a86f3d;--ok:#2f6b49}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:26px}a{color:inherit;text-decoration:none}button,input{font:inherit}.wrap{width:min(620px,calc(100% - 22px));margin:auto}.top{background:var(--dark);color:#fff;position:sticky;top:0;z-index:20}.bar{height:62px;display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;object-fit:contain}.brand{font-weight:950}.brand small{display:block;color:#cfc3b8;font-size:10px}.back{margin-left:auto;border:1px solid #3a342f;background:#25211d;color:#fff;border-radius:12px;padding:9px 11px;font-size:11px;font-weight:900}.hero{padding:22px 0 8px}.hero h1{font-size:31px;margin:5px 0}.hero p{color:var(--muted);font-size:12px;line-height:1.45;margin:0}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}.search input{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff;min-width:0;text-transform:uppercase}.search button{border:0;border-radius:13px;background:var(--dark);color:#fff;padding:0 14px;font-weight:900}.card{background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:17px;margin-top:12px;box-shadow:0 9px 25px rgba(42,29,18,.06)}.order-head{display:flex;justify-content:space-between;align-items:start;gap:10px}.code{font-weight:1000;font-size:16px}.status{font-size:9px;font-weight:1000;padding:6px 8px;border-radius:999px;background:#eee5dc}.status.ready,.status.completed{background:#e2f1e7;color:#275a3c}.meta{margin-top:5px;color:var(--muted);font-size:10.5px;line-height:1.5}.timeline{margin-top:18px}.step{display:grid;grid-template-columns:30px 1fr;gap:10px;position:relative;padding-bottom:17px}.step:not(:last-child):before{content:"";position:absolute;left:14px;top:29px;bottom:0;width:2px;background:#ded5cb}.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e9e2da;color:#8a8076;font-size:11px;font-weight:1000;z-index:1}.step.done .dot{background:var(--dark);color:#fff}.step.current .dot{background:var(--brand);color:#fff;box-shadow:0 0 0 5px rgba(168,111,61,.13)}.step h3{font-size:12px;margin:2px 0}.step p{font-size:10px;color:var(--muted);margin:2px 0;line-height:1.4}.seen{margin-top:12px;background:#eef3fa;border:1px solid #d6e0ee;border-radius:14px;padding:11px;font-size:10.5px;line-height:1.45;color:#38506f}.live{display:inline-flex;align-items:center;gap:6px;background:#e8f3eb;color:#285c3d;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:900;margin-top:10px}.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#3f8b5d}.empty{text-align:center;color:var(--muted);padding:26px 8px;font-size:11px}.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.quick a{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:10px;font-weight:900}.loading{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50}.loader{width:35px;height:35px;border:3px solid #e2d7cc;border-top-color:var(--dark);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none!important}@media(min-width:700px){.hero h1{font-size:38px}.card{padding:22px}}
</style></head><body><div class="loading" id="loading"><div class="loader"></div></div><header class="top"><div class="wrap bar"><img class="logo" src="assets/logo-padoka.svg" alt="PADOKA DA VILLA"><div class="brand">PADOKA DA VILLA<small>Acompanhar pedido</small></div><a class="back" href="index.html">Cardápio</a></div></header><main class="wrap"><section class="hero"><small>SEU PEDIDO</small><h1>Veja cada etapa ao vivo.</h1><p>Saiba quando o pedido entrou no sistema, quando a padaria viu, confirmou, preparou e liberou para retirada.</p><div class="search"><input id="codeInput" placeholder="Ex.: PDK-12AB34CD"><button id="find" type="button">Buscar</button></div><div class="live">Atualização em tempo real</div></section><section class="card" id="result"><div class="empty">Carregando sua conta…</div></section><div class="quick"><a href="conta.html">Minha conta</a><a href="index.html#cardapio">Novo pedido</a></div></main><script>
const CONFIG_URL='https://yncspxfsvlqdnodlsosb.supabase.co/functions/v1/padoka-public-config',$=id=>document.getElementById(id);let sb=null,user=null,channel=null,currentOrder=null;const labels={received:'Recebido',seen:'Visto pela padaria',confirmed:'Confirmado',preparing:'Em preparo',ready:'Pronto para retirada',completed:'Concluído',cancelled:'Cancelado'},normal=['received','seen','confirmed','preparing','ready','completed'];
function fmt(v){return v?new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'Aguardando'}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
async function init(){try{const r=await fetch(CONFIG_URL,{cache:'no-store'});const cfg=await r.json();sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{session}}=await sb.auth.getSession();user=session?.user||null;if(!user){$('result').innerHTML='<div class="empty"><strong>Entre na sua conta PADOKA.</strong><br><br><a href="conta.html" style="font-weight:900">Entrar / criar conta</a></div>';return}const q=new URLSearchParams(location.search).get('code');if(q){$('codeInput').value=q;await findOrder(q)}else{const {data}=await sb.from('padoka_orders').select('code').order('created_at',{ascending:false}).limit(1);if(data?.[0]){$('codeInput').value=data[0].code;await findOrder(data[0].code)}else $('result').innerHTML='<div class="empty">Você ainda não tem pedidos.</div>'}}catch(e){console.error(e);$('result').innerHTML='<div class="empty">Não foi possível conectar agora.</div>'}finally{$('loading').classList.add('hidden')}}
async function findOrder(code){code=String(code||'').trim().toUpperCase();if(!code)return;const {data:o,error}=await sb.from('padoka_orders').select('*').eq('code',code).maybeSingle();if(error||!o){$('result').innerHTML='<div class="empty">Pedido não encontrado na sua conta.</div>';unsubscribe();return}currentOrder=o;const {data:events}=await sb.from('padoka_order_events').select('status,created_at').eq('order_id',o.id).order('created_at',{ascending:true});render(o,events||[]);subscribe(o.id)}
function render(o,events){const by={};events.forEach(e=>{if(!by[e.status])by[e.status]=e.created_at});const idx=normal.indexOf(o.status);const ts={received:o.created_at,seen:o.seen_at||by.seen,confirmed:o.confirmed_at||by.confirmed,preparing:o.preparing_at||by.preparing,ready:o.ready_at||by.ready,completed:o.completed_at||by.completed};$('result').innerHTML=`<div class="order-head"><div><div class="code">${o.code}</div><div class="meta">${money(o.total)} • ${o.pickup_mode==='night'?'🌙 Padoca Noturna':'🏪 Retirada na padaria'}<br>${o.pickup_date} • ${String(o.pickup_time).slice(0,5)}${o.is_test?' • Pedido de teste':''}</div></div><span class="status ${o.status}">${labels[o.status]||o.status}</span></div>${o.seen_at?`<div class="seen"><strong>✓ A padaria já viu seu pedido.</strong><br>Visualizado em ${fmt(o.seen_at)}.</div>`:'<div class="seen"><strong>Pedido recebido pelo sistema.</strong><br>Aguardando a padaria visualizar.</div>'}<div class="timeline">${normal.map((s,i)=>{const done=o.status!=='cancelled'&&i<=idx,current=o.status===s;const desc={received:'Seu pedido entrou no sistema.',seen:'A equipe abriu e visualizou o pedido.',confirmed:'A padaria confirmou o atendimento.',preparing:'Seu pedido está sendo preparado.',ready:'Tudo pronto para retirada.',completed:'Pedido retirado e finalizado.'}[s];return `<div class="step ${done?'done':''} ${current?'current':''}"><div class="dot">${done?'✓':i+1}</div><div><h3>${labels[s]}</h3><p>${desc}<br><strong>${done?fmt(ts[s]):'Aguardando'}</strong></p></div></div>`}).join('')}</div>${o.status==='cancelled'?`<div class="seen" style="background:#f7e5e1;border-color:#eed0ca;color:#813e34"><strong>Pedido cancelado.</strong><br>${fmt(o.cancelled_at||by.cancelled)}</div>`:''}`}
function unsubscribe(){if(channel&&sb){sb.removeChannel(channel);channel=null}}function subscribe(id){unsubscribe();channel=sb.channel('padoka-order-'+id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'padoka_orders',filter:`id=eq.${id}`},async payload=>{currentOrder=payload.new;const {data:events}=await sb.from('padoka_order_events').select('status,created_at').eq('order_id',id).order('created_at',{ascending:true});render(payload.new,events||[])}).subscribe()}
$('find').onclick=()=>findOrder($('codeInput').value);$('codeInput').onkeydown=e=>{if(e.key==='Enter')findOrder(e.target.value)};window.addEventListener('beforeunload',unsubscribe);init();
</script></body></html>
