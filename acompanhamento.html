<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15120f"><title>Acompanhar pedido • PADOKA DA VILLA</title><style>
:root{--bg:#f5efe7;--paper:#fffaf4;--ink:#17130f;--muted:#776e65;--line:#e7dbcf;--dark:#15120f;--brand:#a86f3d;--ok:#2f6b49}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:26px}a{color:inherit;text-decoration:none}button,input{font:inherit}.wrap{width:min(620px,calc(100% - 22px));margin:auto}.top{background:var(--dark);color:#fff;position:sticky;top:0;z-index:20}.bar{height:62px;display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;object-fit:contain}.brand{font-weight:950}.brand small{display:block;color:#cfc3b8;font-size:10px}.back{margin-left:auto;border:1px solid #3a342f;background:#25211d;color:#fff;border-radius:12px;padding:9px 11px;font-size:11px;font-weight:900}.hero{padding:22px 0 8px}.hero h1{font-size:31px;margin:5px 0}.hero p{color:var(--muted);font-size:12px;line-height:1.45;margin:0}.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}.search input{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff;min-width:0;text-transform:uppercase}.search button{border:0;border-radius:13px;background:var(--dark);color:#fff;padding:0 14px;font-weight:900}.card{background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:17px;margin-top:12px;box-shadow:0 9px 25px rgba(42,29,18,.06)}.order-head{display:flex;justify-content:space-between;align-items:start;gap:10px}.code{font-weight:1000;font-size:16px}.status{font-size:9px;font-weight:1000;padding:6px 8px;border-radius:999px;background:#eee5dc}.status.ready,.status.completed{background:#e2f1e7;color:#275a3c}.meta{margin-top:5px;color:var(--muted);font-size:10.5px;line-height:1.5}.timeline{margin-top:18px}.step{display:grid;grid-template-columns:30px 1fr;gap:10px;position:relative;padding-bottom:17px}.step:not(:last-child):before{content:"";position:absolute;left:14px;top:29px;bottom:0;width:2px;background:#ded5cb}.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#e9e2da;color:#8a8076;font-size:11px;font-weight:1000;z-index:1}.step.done .dot{background:var(--dark);color:#fff}.step.current .dot{background:var(--brand);color:#fff;box-shadow:0 0 0 5px rgba(168,111,61,.13)}.step h3{font-size:12px;margin:2px 0}.step p{font-size:10px;color:var(--muted);margin:2px 0;line-height:1.4}.seen{margin-top:12px;background:#eef3fa;border:1px solid #d6e0ee;border-radius:14px;padding:11px;font-size:10.5px;line-height:1.45;color:#38506f}.empty{text-align:center;color:var(--muted);padding:26px 8px;font-size:11px}.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.quick a{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:10px;font-weight:900}.hidden{display:none}@media(min-width:700px){.hero h1{font-size:38px}.card{padding:22px}}
</style></head><body><header class="top"><div class="wrap bar"><img class="logo" src="assets/logo-padoka.svg" alt="PADOKA DA VILLA"><div class="brand">PADOKA DA VILLA<small>Acompanhar pedido</small></div><a class="back" href="index.html">Cardápio</a></div></header><main class="wrap"><section class="hero"><small>SEU PEDIDO</small><h1>Veja em que etapa está.</h1><p>Você consegue saber se o pedido foi recebido, visto pela padaria, confirmado, preparado e liberado para retirada.</p><div class="search"><input id="codeInput" placeholder="Ex.: PDK-123456"><button id="find" type="button">Buscar</button></div></section><section class="card" id="result"><div class="empty">Digite o código do pedido ou faça um pedido de demonstração.</div></section><div class="quick"><a href="conta.html">Minha conta</a><a href="index.html#cardapio">Fazer novo pedido</a></div></main><script>
const KEY='padoka_orders_v1',$=id=>document.getElementById(id);const labels={received:'Recebido',seen:'Visto pela padaria',confirmed:'Confirmado',preparing:'Em preparo',ready:'Pronto para retirada',completed:'Concluído',cancelled:'Cancelado'};const normal=['received','seen','confirmed','preparing','ready','completed'];
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function fmt(v){return v?new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'Aguardando'}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function find(code){const o=load().find(x=>String(x.code).toUpperCase()===String(code).trim().toUpperCase());if(!o){$('result').innerHTML='<div class="empty">Pedido não encontrado neste navegador.<br><small>Na versão online final, a consulta virá do banco compartilhado.</small></div>';return}const idx=normal.indexOf(o.status);const history=Object.fromEntries((o.history||[]).map(h=>[h.status,h.at]));$('result').innerHTML=`<div class="order-head"><div><div class="code">${o.code}</div><div class="meta">${money(o.total)} • ${o.pickup?.mode==='noturna'?'🌙 Padoca Noturna':'🏪 Retirada na padaria'}<br>${o.pickup?.date||''} ${o.pickup?.time||''}</div></div><span class="status ${o.status}">${labels[o.status]||o.status}</span></div>${o.seenAt?`<div class="seen"><strong>✓ A padaria já viu seu pedido.</strong><br>Visualizado em ${fmt(o.seenAt)}.</div>`:'<div class="seen"><strong>Pedido recebido pelo sistema.</strong><br>Aguardando a padaria visualizar.</div>'}<div class="timeline">${normal.map((s,i)=>{const done=o.status==='cancelled'?false:i<=idx;const current=o.status===s;let at=s==='received'?o.createdAt:history[s]||o[({seen:'seenAt',confirmed:'confirmedAt',ready:'readyAt',completed:'completedAt'})[s]];const desc={received:'Seu pedido entrou no sistema.',seen:'A equipe abriu e visualizou o pedido.',confirmed:'A padaria confirmou que vai preparar.',preparing:'Seu pedido está sendo preparado.',ready:'Tudo pronto para retirar.',completed:'Pedido retirado e finalizado.'}[s];return `<div class="step ${done?'done':''} ${current?'current':''}"><div class="dot">${done?'✓':i+1}</div><div><h3>${labels[s]}</h3><p>${desc}<br><strong>${done?fmt(at):'Aguardando'}</strong></p></div></div>`}).join('')}</div>${o.status==='cancelled'?'<div class="seen" style="background:#f7e5e1;border-color:#eed0ca;color:#813e34"><strong>Pedido cancelado.</strong> Consulte a padaria se precisar de ajuda.</div>':''}`;}
$('find').onclick=()=>find($('codeInput').value);$('codeInput').onkeydown=e=>{if(e.key==='Enter')find(e.target.value)};const q=new URLSearchParams(location.search).get('code');if(q){$('codeInput').value=q;find(q)}else{const p=load().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))[0];if(p){$('codeInput').value=p.code;find(p.code)}}window.addEventListener('storage',()=>{if($('codeInput').value)find($('codeInput').value)});
</script></body></html>
