<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15120f">
<title>Seus pedidos • PADOKA DA VILLA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5efe7;--paper:#fffdf9;--ink:#17130f;--muted:#776e65;--line:#e7dbcf;--dark:#15120f;--brand:#a86f3d;--ok:#2f6b49;--blue:#315f8d;--warn:#95611f;--danger:#9b453a;--shadow:0 14px 36px rgba(42,29,18,.08)}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:linear-gradient(180deg,#eee4da 0,#f7f2ec 270px,var(--bg) 100%);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:90px;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}button{font:inherit}.wrap{width:min(680px,calc(100% - 22px));margin:auto}.top{position:sticky;top:0;z-index:30;background:rgba(21,18,15,.98);color:#fff;border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(14px)}.bar{height:64px;display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;object-fit:contain}.brand{font-weight:950;line-height:1.03}.brand small{display:block;color:#cfc3b8;font-size:9px;margin-top:3px;font-weight:650}.back{margin-left:auto;border:1px solid #3b342f;background:#27221e;color:#fff;border-radius:13px;padding:10px 12px;font-size:10.5px;font-weight:900}.hero{padding:25px 2px 12px}.eyebrow{font-size:9.5px;letter-spacing:.13em;font-weight:950;color:var(--brand)}h1{font-size:36px;line-height:1;letter-spacing:-.04em;margin:7px 0 7px}.hero p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.5}.live{display:inline-flex;align-items:center;gap:6px;margin-top:11px;background:#e7f2eb;color:#275b3d;border:1px solid #d5e8db;border-radius:999px;padding:7px 9px;font-size:9px;font-weight:900}.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#3c8c5c;box-shadow:0 0 0 4px rgba(60,140,92,.10)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:4px 0 13px}.summary-card{background:rgba(255,253,249,.96);border:1px solid var(--line);border-radius:16px;padding:11px;box-shadow:0 7px 18px rgba(42,29,18,.04)}.summary-card strong{display:block;font-size:18px;line-height:1}.summary-card span{display:block;color:var(--muted);font-size:8.5px;margin-top:5px;line-height:1.2}.orders{display:grid;gap:11px}.order{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:var(--shadow);overflow:hidden;position:relative}.order.ready{border-color:#b9dac5;box-shadow:0 14px 34px rgba(47,107,73,.10)}.order.ready:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#3d8a5c}.order.cancelled{opacity:.82}.order-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.code{font-weight:1000;font-size:13px;letter-spacing:.01em}.date{color:var(--muted);font-size:9px;margin-top:3px}.status{white-space:nowrap;border-radius:999px;padding:6px 8px;background:#eee6de;font-size:8.5px;font-weight:950}.status.seen{background:#e7eef8;color:#355475}.status.confirmed{background:#eee9f7;color:#5a477c}.status.preparing{background:#fff0d7;color:#825b1f}.status.ready{background:#e0f1e6;color:#24593b}.status.completed{background:#e8eee9;color:#496158}.status.cancelled{background:#f7e5e1;color:#843d33}.headline{margin:13px 0 4px;font-size:19px;letter-spacing:-.025em}.headline.ready{color:var(--ok)}.message{color:var(--muted);font-size:10.5px;line-height:1.45;margin:0}.pickup{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.box{background:#f7f2ec;border:1px solid #eee4da;border-radius:13px;padding:10px}.box span{display:block;color:var(--muted);font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.box strong{display:block;font-size:10.5px;margin-top:4px;line-height:1.3}.progress{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:14px}.progress-step{text-align:center;min-width:0}.rail{height:4px;background:#e5ddd5;border-radius:999px;margin-bottom:6px}.progress-step.done .rail{background:var(--dark)}.progress-step.current .rail{background:var(--brand)}.progress-step.ready.current .rail{background:var(--ok)}.progress-step small{display:block;color:#988d83;font-size:6.6px;line-height:1.05;overflow:hidden;text-overflow:ellipsis}.progress-step.done small,.progress-step.current small{color:var(--ink);font-weight:900}.details{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.total{font-size:10px;color:var(--muted)}.total strong{display:block;color:var(--ink);font-size:15px;margin-top:2px}.details-btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 10px;font-size:9px;font-weight:900}.timeline{display:none;margin-top:12px;padding:12px;background:#f8f4ef;border:1px solid #eee5dc;border-radius:14px}.timeline.open{display:block}.event{display:grid;grid-template-columns:22px 1fr;gap:8px;position:relative;padding-bottom:11px}.event:last-child{padding-bottom:0}.event:not(:last-child):before{content:"";position:absolute;left:10px;top:21px;bottom:0;width:2px;background:#ddd4cb}.dot{width:22px;height:22px;border-radius:50%;background:#e7dfd7;color:#968b82;display:grid;place-items:center;font-size:8px;font-weight:1000;z-index:1}.event.done .dot{background:var(--dark);color:#fff}.event.current .dot{background:var(--brand);color:#fff}.event h3{font-size:9.5px;margin:2px 0}.event p{font-size:8.5px;color:var(--muted);margin:2px 0;line-height:1.35}.empty{background:rgba(255,253,249,.95);border:1px solid var(--line);border-radius:22px;padding:30px 20px;text-align:center;box-shadow:var(--shadow)}.empty strong{display:block;font-size:17px;margin-bottom:5px}.empty span{display:block;color:var(--muted);font-size:10.5px;line-height:1.45}.cta{display:inline-block;margin-top:13px;background:var(--dark);color:#fff;border-radius:12px;padding:10px 13px;font-size:10px;font-weight:900}.loading{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:60}.loader{width:36px;height:36px;border:3px solid #e2d7cc;border-top-color:var(--dark);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none!important}.bottom{position:fixed;left:9px;right:9px;bottom:max(7px,env(safe-area-inset-bottom));height:62px;background:rgba(21,18,15,.98);border:1px solid rgba(255,255,255,.08);border-radius:19px;z-index:25;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 10px 30px rgba(0,0,0,.24);overflow:hidden}.bottom a{color:#bdb1a7;display:grid;place-items:center;align-content:center;gap:2px;font-size:8.5px;font-weight:850}.bottom b{font-size:18px;line-height:1}.bottom .active{color:#fff}@media(min-width:700px){body{padding-bottom:30px}.bottom{display:none}.wrap{width:min(720px,calc(100% - 40px))}.hero{padding-top:32px}h1{font-size:43px}.order{padding:19px}.progress-step small{font-size:8px}}
</style>
</head>
<body>
<div class="loading" id="loading"><div class="loader" aria-label="Carregando"></div></div>
<header class="top"><div class="wrap bar"><img class="logo" src="assets/logo-padoka.svg" alt="PADOKA DA VILLA"><div class="brand">PADOKA DA VILLA<small>Pedidos do cliente</small></div><a class="back" href="index.html">Cardápio</a></div></header>
<main class="wrap">
<section class="hero"><span class="eyebrow">MINHA PADOKA</span><h1>Seus pedidos</h1><p>Os pedidos mais recentes aparecem primeiro. Acompanhe cada etapa sem precisar pesquisar código.</p><div class="live">Atualização em tempo real</div></section>
<section class="summary hidden" id="summary"><div class="summary-card"><strong id="activeCount">0</strong><span>EM ANDAMENTO</span></div><div class="summary-card"><strong id="readyCount">0</strong><span>PRONTOS</span></div><div class="summary-card"><strong id="historyCount">0</strong><span>HISTÓRICO</span></div></section>
<section class="orders" id="orders"><div class="empty"><strong>Carregando seus pedidos…</strong></div></section>
</main>
<nav class="bottom"><a href="index.html"><b>⌂</b>Início</a><a class="active" href="acompanhamento.html"><b>◎</b>Pedidos</a><a href="conta.html"><b>♙</b>Conta</a></nav>
<script>
const CONFIG_URL='https://yncspxfsvlqdnodlsosb.supabase.co/functions/v1/padoka-public-config';
const $=id=>document.getElementById(id);let sb=null,user=null,channel=null;
const states=['received','seen','confirmed','preparing','ready','completed'];
const labels={received:'Recebido',seen:'Visto',confirmed:'Confirmado',preparing:'Em preparo',ready:'Pronto',completed:'Retirado',cancelled:'Cancelado'};
const copy={
 received:['Pedido recebido','Seu pedido entrou no sistema e está aguardando a padaria visualizar.'],
 seen:['A padaria já viu seu pedido','A equipe abriu seu pedido e já sabe que ele chegou.'],
 confirmed:['Pedido confirmado','A padaria confirmou o atendimento e vai preparar seu pedido.'],
 preparing:['Seu pedido está sendo preparado','A equipe está preparando os itens para sua retirada.'],
 ready:['Pode vir buscar!','Seu pedido está pronto e esperando por você na retirada.'],
 completed:['Pedido retirado','Este pedido foi finalizado. Obrigado pela preferência!'],
 cancelled:['Pedido cancelado','Este pedido foi cancelado. Se precisar, entre em contato com a padaria.']
};
const stepLabel={received:'Recebido',seen:'Visto',confirmed:'Confirmado',preparing:'Preparo',ready:'Pronto',completed:'Retirado'};
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function dt(v){return v?new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'Aguardando'}
function day(v){if(!v)return '—';const [y,m,d]=String(v).split('-');return d&&m&&y?`${d}/${m}/${y}`:v}
function time(v){return v?String(v).slice(0,5):'—'}
function pickupLabel(o){return o.pickup_mode==='night'?'🌙 Padoca Noturna':'🏪 Retirada na padaria'}
function eventTimes(events){const out={};(events||[]).forEach(e=>{if(!out[e.status])out[e.status]=e.created_at});return out}
function timeline(o,events){const by=eventTimes(events),idx=states.indexOf(o.status);return `<div class="timeline" id="timeline-${o.id}">${states.map((s,i)=>{const done=o.status!=='cancelled'&&i<=idx,current=o.status===s;const stamp=s==='received'?o.created_at:by[s]||o[({seen:'seen_at',confirmed:'confirmed_at',preparing:'preparing_at',ready:'ready_at',completed:'completed_at'})[s]];return `<div class="event ${done?'done':''} ${current?'current':''}"><div class="dot">${done?'✓':i+1}</div><div><h3>${labels[s]}</h3><p>${done?dt(stamp):'Aguardando'}</p></div></div>`}).join('')}</div>`}
function progress(o){const idx=states.indexOf(o.status);return `<div class="progress">${states.map((s,i)=>`<div class="progress-step ${o.status!=='cancelled'&&i<=idx?'done':''} ${o.status===s?'current':''} ${s==='ready'?'ready':''}"><div class="rail"></div><small>${stepLabel[s]}</small></div>`).join('')}</div>`}
function card(o,events){const text=copy[o.status]||copy.received;return `<article class="order ${o.status}" id="order-${o.code}"><div class="order-top"><div><div class="code">${o.code}</div><div class="date">Feito em ${dt(o.created_at)}</div></div><span class="status ${o.status}">${labels[o.status]||o.status}</span></div><h2 class="headline ${o.status}">${text[0]}</h2><p class="message">${text[1]}</p><div class="pickup"><div class="box"><span>Retirada</span><strong>${pickupLabel(o)}</strong></div><div class="box"><span>Quando</span><strong>${day(o.pickup_date)} • ${time(o.pickup_time)}</strong></div></div>${progress(o)}<div class="details"><div class="total">Total do pedido<strong>${money(o.total)}</strong></div><button class="details-btn" type="button" data-toggle="${o.id}">Ver etapas</button></div>${timeline(o,events)}</article>`}
function bindToggles(){document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const t=$('timeline-'+b.dataset.toggle);const open=t.classList.toggle('open');b.textContent=open?'Ocultar etapas':'Ver etapas'})}
async function loadOrders(){const {data:orders,error}=await sb.from('padoka_orders').select('id,code,status,pickup_mode,pickup_date,pickup_time,total,created_at,seen_at,confirmed_at,preparing_at,ready_at,completed_at,cancelled_at,is_test').order('created_at',{ascending:false}).limit(50);if(error){console.error(error);$('orders').innerHTML='<div class="empty"><strong>Não foi possível carregar seus pedidos.</strong><span>Tente novamente em alguns instantes.</span></div>';return}if(!orders?.length){$('summary').classList.add('hidden');$('orders').innerHTML='<div class="empty"><strong>Você ainda não tem pedidos.</strong><span>Quando fizer seu primeiro pedido, ele aparecerá aqui automaticamente.</span><a class="cta" href="index.html#cardapio">Fazer um pedido</a></div>';return}const ids=orders.map(o=>o.id);const {data:events,error:eventsError}=await sb.from('padoka_order_events').select('order_id,status,created_at').in('order_id',ids).order('created_at',{ascending:true});if(eventsError)console.error(eventsError);const grouped={};(events||[]).forEach(e=>(grouped[e.order_id]??=[]).push(e));$('orders').innerHTML=orders.map(o=>card(o,grouped[o.id]||[])).join('');bindToggles();const active=orders.filter(o=>['received','seen','confirmed','preparing'].includes(o.status)).length,ready=orders.filter(o=>o.status==='ready').length,history=orders.filter(o=>['completed','cancelled'].includes(o.status)).length;$('activeCount').textContent=active;$('readyCount').textContent=ready;$('historyCount').textContent=history;$('summary').classList.remove('hidden');const focus=new URLSearchParams(location.search).get('code');if(focus){setTimeout(()=>document.getElementById('order-'+CSS.escape(focus))?.scrollIntoView({behavior:'smooth',block:'center'}),120)}}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('padoka-customer-orders').on('postgres_changes',{event:'*',schema:'public',table:'padoka_orders'},()=>loadOrders()).subscribe()}
async function init(){try{const r=await fetch(CONFIG_URL,{cache:'no-store'});if(!r.ok)throw new Error('config');const cfg=await r.json();sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data:{session}}=await sb.auth.getSession();user=session?.user||null;if(!user){$('orders').innerHTML='<div class="empty"><strong>Entre para ver seus pedidos.</strong><span>Seus pedidos ficam protegidos e vinculados à sua conta PADOKA.</span><a class="cta" href="conta.html">Entrar / criar conta</a></div>';return}await loadOrders();subscribe()}catch(e){console.error(e);$('orders').innerHTML='<div class="empty"><strong>Não foi possível conectar agora.</strong><span>Verifique sua internet e tente novamente.</span></div>'}finally{$('loading').classList.add('hidden')}}
window.addEventListener('beforeunload',()=>{if(channel&&sb)sb.removeChannel(channel)});init();
</script>
</body></html>
