<link rel="icon" href="assets/logo-padoka.svg" type="image/svg+xml"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="PADOKA"><script src="assets/padoka-pwa.js?v=3" defer></script><script src="assets/customer-notifications.js" defer></script></head><body><div class="loading" id="loading"><div class="spinner"></div></div><header class="top"><div class="wrap bar"><a class="brand" href="index.html#cardapio"><img class="logo" src="assets/logo-padoka.svg" alt="PADOKA"><span>PADOKA DA VILLA<small>ACOMPANHAMENTO</small></span></a><a class="back" href="index.html#cardapio">Cardápio</a></div></header><main class="wrap"><section class="hero"><small>MEUS PEDIDOS</small><h1>Acompanhe seu pedido</h1><p>O andamento abaixo muda quando a equipe da PADOKA atualiza o pedido.</p><span class="live">ATUALIZAÇÃO EM TEMPO REAL</span></section><section class="orders" id="orders"></section></main><nav class="bottom"><a href="index.html#cardapio"><b>⌂</b>Cardápio</a><a class="active" href="acompanhamento.html"><b>◎</b>Pedidos</a><a href="conta.html"><b>♙</b>Conta</a></nav><script>const CONFIG_URL='https://yncspxfsvlqdnodlsosb.supabase.co/functions/v1/padoka-public-config',$=id=>document.getElementById(id);let sb=null,channel=null,authSubscription=null,activeCustomerId=null,sessionGeneration=0,itemsByOrder={},eventsByOrder={};const states=['received','seen','confirmed','preparing','ready','completed'],labels={received:'Pedido recebido',seen:'A padaria viu seu pedido',confirmed:'Pedido confirmado',preparing:'Estamos preparando',ready:'Pronto para retirada',completed:'Pedido retirado',cancelled:'Pedido cancelado'},headlines={received:'Pedido recebido',seen:'A padaria já viu',confirmed:'Pedido confirmado',preparing:'Estamos preparando',ready:'Pode vir buscar!',completed:'Pedido retirado',cancelled:'Pedido cancelado'},copy={received:'Seu pedido chegou para a PADOKA e aguarda visualização da equipe.',seen:'A equipe já abriu seu pedido e sabe que ele chegou.',confirmed:'Seu pedido foi aceito e entrou na fila de preparo.',preparing:'A equipe está preparando seus itens.',ready:'Tudo pronto. Seu pedido já está esperando por você.',completed:'Pedido finalizado. Obrigado por escolher a PADOKA!',cancelled:'Este pedido foi cancelado.'},icons={received:'🧾',seen:'👀',confirmed:'✓',preparing:'🥐',ready:'🛍️',completed:'✨',cancelled:'×'};const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),dt=v=>v?new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'Aguardando',esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function timeline(o){const idx=states.indexOf(o.status),times=eventsByOrder[o.id]||{};return `<div class="progress">${states.map((s,i)=>`<div class="pstep ${o.status!=='cancelled'&&i<=idx?'done':''} ${o.status===s?'current':''} ${s==='ready'?'ready':''}"><div class="dot">${o.status!=='cancelled'&&i<=idx?'✓':i+1}</div><div><h3>${labels[s]}</h3><p>${o.status!=='cancelled'&&i<=idx?dt(times[s]||(s==='received'?o.created_at:null)):'Aguardando atualização da padaria'}</p></div></div>`).join('')}</div>`}function details(o){const items=itemsByOrder[o.id]||[];return `<details class="order-details"><summary>Ver itens e detalhes do pedido</summary><div class="detail-body">${items.length?items.map(i=>`<div class="detail-item"><span>${Number(i.quantity)}× ${esc(i.product_name)}</span><strong>${money(Number(i.quantity)*Number(i.unit_price))}</strong></div>`).join(''):'<div class="detail-empty">Os itens deste pedido não puderam ser carregados agora. O andamento continua disponível normalmente.</div>'}<div class="detail-meta"><div>Retirada: <strong>${o.pickup_mode==='night'?'Padoca Noturna':'Na padaria'}</strong></div><div>Data e horário: <strong>${esc(o.pickup_date||'—')} • ${esc(String(o.pickup_time||'').slice(0,5)||'—')}</strong></div><div>Código: <strong>${esc(o.code)}</strong></div></div></div></details>`}function paymentBox(o){const pending=!['completed','cancelled'].includes(o.status)&&['pending','not_configured'].includes(String(o.payment_status||''));if(o.payment_status==='paid')return `<div class="paybox paid"><div class="payhead"><strong>Pagamento Pix</strong><span class="paystate">CONFIRMADO</span></div><p class="paytext">O pagamento foi conferido pela administração da PADOKA.</p></div>`;if(!pending)return '';return `<div class="paybox"><div class="payhead"><strong>Pagamento Pix</strong><span class="paystate">AGUARDANDO</span></div><p class="paytext">O Pix automático ainda não está disponível para este pedido. A equipe só poderá avançar depois que o recebimento for confirmado pelo fluxo seguro da PADOKA.</p></div>`}function card(o){return `<article class="order ${o.status}"><div class="toprow"><div><div class="code">${esc(o.code)}</div><div class="date">Feito em ${dt(o.created_at)}</div></div><span class="status ${o.status}">${labels[o.status]||esc(o.status)}</span></div><div class="heroicon">${icons[o.status]||'🧾'}</div><h2 class="headline">${headlines[o.status]||'Pedido'}</h2><p class="message">${copy[o.status]||''}</p>${o.status==='cancelled'?'':timeline(o)}<div class="pickup"><div class="box"><span>Retirada</span><strong>${o.pickup_mode==='night'?'🌙 Padoca Noturna':'🏪 Na padaria'}</strong></div><div class="box"><span>Data e horário</span><strong>${esc(o.pickup_date||'—')} • ${esc(String(o.pickup_time||'').slice(0,5)||'—')}</strong></div></div>${paymentBox(o)}${details(o)}<div class="foot"><div class="total">Total<strong>${money(o.total)}</strong></div></div></article>`}function signedOutView(){return '<div class="empty"><strong>Entre na sua conta para acompanhar seus pedidos.</strong><br><a class="cta" href="conta.html">Entrar na conta</a></div>'}function loadingCustomerView(){return '<div class="empty">Carregando seus pedidos…</div>'}function currentSession(customerId,generation){return activeCustomerId===customerId&&sessionGeneration===generation}function beginSessionTransition(nextId){const generation=++sessionGeneration;activeCustomerId=nextId;itemsByOrder={};eventsByOrder={};$('orders').innerHTML=nextId?loadingCustomerView():signedOutView();return generation}async function removeProgressChannel(){if(!channel||!sb)return;const old=channel;channel=null;try{await sb.removeChannel(old)}catch(e){console.error('Falha ao remover canal antigo de pedidos',e)}}async function loadCustomer(customerId,generation=sessionGeneration){const {data,error}=await sb.from('padoka_orders').select('id,code,status,pickup_mode,pickup_date,pickup_time,total,created_at,is_test,payment_status,payment_provider').eq('customer_id',customerId).order('created_at',{ascending:false}).limit(50);if(!currentSession(customerId,generation))return null;if(error){$('orders').innerHTML='<div class="empty">Não foi possível carregar seus pedidos agora.</div>';return customerId}const nextItems={},nextEvents={},ids=(data||[]).map(o=>o.id);if(ids.length){const [{data:itemRows,error:itemError},{data:eventRows,error:eventError}]=await Promise.all([sb.from('padoka_order_items').select('id,order_id,product_name,quantity,unit_price').in('order_id',ids).order('id',{ascending:true}),sb.from('padoka_order_events').select('id,order_id,status,created_at').in('order_id',ids).order('created_at',{ascending:true})]);if(!currentSession(customerId,generation))return null;if(!itemError)(itemRows||[]).forEach(i=>(nextItems[i.order_id]||(nextItems[i.order_id]=[])).push(i));else console.error('Falha ao carregar itens do pedido',itemError);if(!eventError)(eventRows||[]).forEach(e=>{const map=nextEvents[e.order_id]||(nextEvents[e.order_id]={});if(!map[e.status])map[e.status]=e.created_at});else console.error('Falha ao carregar histórico do pedido',eventError)}if(!currentSession(customerId,generation))return null;itemsByOrder=nextItems;eventsByOrder=nextEvents;const code=new URLSearchParams(location.search).get('code'),list=code?(data||[]).filter(o=>o.code===code):(data||[]);$('orders').innerHTML=list.length?list.map(card).join(''):'<div class="empty"><strong>Você ainda não tem pedidos.</strong><br><a class="cta" href="index.html#cardapio">Fazer pedido</a></div>';return customerId}async function applySession(session,{force=false,generation=null}={}){const nextId=session?.user?.id||null;if(!force&&nextId===activeCustomerId)return;const activeGeneration=generation??beginSessionTransition(nextId);await removeProgressChannel();if(!currentSession(nextId,activeGeneration))return;if(!nextId)return;await loadCustomer(nextId,activeGeneration);if(!currentSession(nextId,activeGeneration))return;channel=sb.channel(`padoka-client-progress-${nextId}`).on('postgres_changes',{event:'*',schema:'public',table:'padoka_orders',filter:`customer_id=eq.${nextId}`},()=>loadCustomer(nextId,activeGeneration)).subscribe()}async function init(){try{const r=await fetch(CONFIG_URL,{cache:'no-store'});if(!r.ok)throw new Error('config');const c=await r.json();sb=window.supabase.createClient(c.url,c.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}});window.padokaSupabase=sb;window.dispatchEvent(new CustomEvent('padoka:supabase-ready',{detail:{client:sb}}));const {data:{session}}=await sb.auth.getSession();await applySession(session,{force:true});const {data}=sb.auth.onAuthStateChange((_event,nextSession)=>{const nextId=nextSession?.user?.id||null;if(nextId===activeCustomerId)return;const generation=beginSessionTransition(nextId);setTimeout(()=>applySession(nextSession,{force:true,generation}),0)});authSubscription=data.subscription}catch(e){console.error(e);itemsByOrder={};eventsByOrder={};activeCustomerId=null;$('orders').innerHTML='<div class="empty">Não foi possível conectar ao acompanhamento.</div>'}finally{$('loading').classList.add('hidden')}}addEventListener('pagehide',()=>{authSubscription?.unsubscribe();if(channel&&sb)sb.removeChannel(channel)});init();</script></body></html>
