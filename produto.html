<script>
const CART_KEY='padoka_cart_mobile_v1',$=id=>document.getElementById(id),money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let product=null;
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1600)}
function safeId(v){const s=String(v||'').trim();return /^[a-z0-9][a-z0-9_-]{0,79}$/i.test(s)?s:''}
function currentId(){return safeId(new URLSearchParams(location.search).get('id'))}
function setMeta(p){document.title=p.name.replace(/&amp;/g,'&')+' • PADOKA DA VILLA';$('descriptionMeta').content=(p.desc||p.name).replace(/&[^;]+;/g,' ').slice(0,155);$('canonicalLink').href=new URL('produto.html?id='+encodeURIComponent(p.id),location.href).href;if(p.is_demo){$('robotsMeta').content='noindex,nofollow';return}$('robotsMeta').content='index,follow';const schema={ '@context':'https://schema.org','@type':'Product',name:p.name.replace(/&[^;]+;/g,' '),description:p.desc||p.name,sku:p.id,brand:{'@type':'Brand',name:'PADOKA DA VILLA'},image:[new URL(p.img,location.href).href],offers:{'@type':'Offer',priceCurrency:'BRL',price:Number(p.price).toFixed(2),availability:'https://schema.org/InStock',url:location.href}};const node=document.createElement('script');node.type='application/ld+json';node.textContent=JSON.stringify(schema);document.head.appendChild(node)}
function render(){const id=currentId(),list=window.PADOKA_CATALOG||[];if(!id){$('loadingState').textContent='Produto inválido.';return}product=list.find(p=>p.id===id);if(!product){if(window.PADOKA_CATALOG_READY){$('loadingState').textContent='Produto não encontrado ou indisponível.'}return}$('loadingState').hidden=true;$('productView').hidden=false;$('productName').innerHTML=product.name;$('productCategory').innerHTML=product.category;$('productDescription').textContent=product.desc||'Produto disponível no cardápio PADOKA.';$('productPrice').textContent=money(product.price);$('productUnit').textContent='/ '+product.unit;$('productTag').textContent=product.tag;$('productImage').src=product.img;$('productImage').alt=product.name.replace(/&[^;]+;/g,' ');$('demoNotice').hidden=!product.is_demo;setMeta(product);renderRelated();window.PADOKA_TELEMETRY?.track('product_view',{product_id:product.id})}
function renderRelated(){const related=(window.PADOKA_CATALOG||[]).filter(p=>p.id!==product.id&&p.category===product.category).slice(0,4);if(!related.length)return;$('relatedSection').hidden=false;$('relatedGrid').innerHTML=related.map(p=>'<a class="card" data-product-link="'+p.id+'" href="produto.html?id='+encodeURIComponent(p.id)+'"><img src="'+p.img+'" alt="'+p.name+'" loading="lazy" data-padoka-fallback="16px"><div><strong>'+p.name+'</strong><small>'+money(p.price)+' • '+p.unit+'</small></div></a>').join('')}
$('addProduct').onclick=()=>{if(!product)return;let cart={};try{cart=JSON.parse(localStorage.getItem(CART_KEY)||'{}')}catch{}cart[product.id]=Math.min(50,(Number(cart[product.id])||0)+1);localStorage.setItem(CART_KEY,JSON.stringify(cart));window.PADOKA_TELEMETRY?.track('add_to_cart',{product_id:product.id});toast('Adicionado ao carrinho.');setTimeout(()=>location.href='index.html#cardapio',500)};
addEventListener('padoka:catalog-updated',render);setTimeout(render,0);
</script>
