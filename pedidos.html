<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#15120f"><title>Pedidos • PADOKA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="assets/internal-nav.css"><style>:root{--bg:#f2eee8;--paper:#fff;--ink:#17130f;--muted:#716960;--line:#e5ddd4;--dark:#15120f;--brand:#a86f3d;--ok:#2f6b49;--danger:#9f4336}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}.wrap{width:min(1220px,calc(100% - 22px));margin:auto}.head{padding:22px 0 10px;display:flex;justify-content:space-between;align-items:end;gap:12px}.head h1{margin:3px 0;font-size:32px}.head p{margin:0;color:var(--muted);font-size:11px}.live{background:#e5f1e9;color:#285b3e;border:1px solid #cde2d4;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:950}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin:14px 0}.search,.filter{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-bottom:30px}.order{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 8px 24px #2a1d1208}.order.received{border-left:4px solid #d29b3e}.order.ready{border-left:4px solid #3c8c5c}.toprow{display:flex;justify-content:space-between;gap:10px}.code{font-weight:1000;font-size:14px}.status{border-radius:999px;padding:6px 8px;font-size:9px;font-weight:950;background:#eee7df;height:max-content}.status.ready{background:#e4f1e8;color:#285b3e}.status.cancelled{background:#f8e9e6;color:#843d33}.meta,.customer{font-size:10px;color:var(--muted);line-height:1.5;margin-top:5px}.customer{padding-top:9px;border-top:1px solid var(--line);color:var(--ink)}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:12px}.flow div{height:5px;border-radius:999px;background:#e6ddd5}.flow div.done{background:var(--dark)}.flow div.current{background:var(--brand)}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.step{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font-size:9px;font-weight:900;cursor:pointer}.step.primary{background:var(--dark);color:#fff;border-color:var(--dark)}.step.cancel{color:var(--danger)}.step:disabled{opacity:.5;cursor:wait}.detail{margin-top:9px;background:#f8f5f1;border-radius:12px;padding:10px;font-size:9.5px;line-height:1.5}.detail-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:7px}.detail-items{display:grid;gap:5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}.detail-item{display:grid;grid-template-columns:1fr auto;gap:10px}.detail-item span{color:var(--muted)}.hidden{display:none!important}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;text-align:center;color:var(--muted);font-size:10px}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,12px);opacity:0;background:#17130f;color:#fff;border-radius:999px;padding:10px 14px;font-size:10px;font-weight:850;transition:.2s;z-index:90;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:800px){.list{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.toolbar{grid-template-columns:1fr}.flow{gap:2px}}@media(max-width:480px){.wrap{width:min(100% - 14px,1220px)}.order{padding:12px}.actions{display:grid;grid-template-columns:1fr 1fr}.step{padding:10px 7px}}</style></head><body><div id="padokaInternalNav" data-current="pedidos" data-subtitle="PEDIDOS DA EQUIPE"></div><main class="wrap"><section class="head"><div><small>OPERAÇÃO</small><h1>Pedidos</h1><p>A equipe controla o andamento que o cliente acompanha em tempo real.</p></div><span class="live">ATUALIZAÇÃO EM TEMPO REAL</span></section><div class="toolbar"><input class="search" id="search" placeholder="Buscar código ou cliente"><select class="filter" id="filter"><option value="all">Todos</option><option value="received">Novos</option><option value="seen">Vistos</option><option value="confirmed">Confirmados</option><option value="preparing">Em preparo</option><option value="ready">Prontos</option><option value="completed">Concluídos</option><option value="cancelled">Cancelados</option></select></div><section class="list" id="list"></section></main><div class="toast" id="toast"></div><script src="assets/internal-nav.js"></script><script>
const CONFIG_URL='https://yncspxfsvlqdnodlsosb.supabase.co/functions/v1/padoka-public-config',$=id=>document.getElementById(id);let sb=null,orders=[],profiles={},channel=null,busy=false,statusRpcAvailable=null;const states=['received','seen','confirmed','preparing','ready','completed'],labels={received:'Recebido',seen:'Visto pela padaria',confirmed:'Confirmado',preparing:'Em preparo',ready:'Pronto para retirada',completed:'Concluído',cancelled:'Cancelado'};const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),fmt=v=>v?new Date(v).toLocaleString('pt-BR'):'—';function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.padokaToast);window.padokaToast=setTimeout(()=>$('toast').classList.remove('show'),1800)}function progress(o){const idx=states.indexOf(o.status);return `<div class="flow" aria-label="Progresso do pedido">${states.map((s,i)=>`<div class="${o.status!=='cancelled'&&i<=idx?'done':''} ${o.status===s?'current':''}" title="${esc(labels[s])}"></div>`).join('')}</div>`}
async function init(){try{const r=await fetch(CONFIG_URL,{cache:'no-store'});if(!r.ok)throw new Error('config');const c=await r.json();sb=window.supabase.createClient(c.url,c.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}});window.padokaSupabase=sb;const {data:{session}}=await sb.auth.getSession();if(!session)return $('list').innerHTML='<div class="empty">Entre pelo painel administrativo.</div>';const {data:s,error}=await sb.from('padoka_staff_users').select('active').eq('user_id',session.user.id).maybeSingle();if(error||!s?.active)return $('list').innerHTML='<div class="empty">Acesso interno não autorizado.</div>';await reload();channel=sb.channel('padoka-orders-ui').on('postgres_changes',{event:'*',schema:'public',table:'padoka_orders'},reload).subscribe()}catch(e){console.error(e);$('list').innerHTML='<div class="empty">Não foi possível carregar os pedidos.</div>'}}
async function reload(){if(!sb)return;const {data,error}=await sb.from('padoka_orders').select('*').order('created_at',{ascending:false}).limit(200);if(error){console.error(error);return toast('Falha ao atualizar a fila.')}orders=data||[];const ids=[...new Set(orders.map(o=>o.customer_id).filter(Boolean))];profiles={};if(ids.length){const {data:p}=await sb.from('padoka_profiles').select('id,full_name,phone').in('id',ids);(p||[]).forEach(x=>profiles[x.id]=x)}render()}
function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const list=orders.filter(o=>{const p=profiles[o.customer_id]||{};return(f==='all'||o.status===f)&&(!q||(`${o.code} ${p.full_name||o.pickup_name||''}`).toLowerCase().includes(q))});$('list').innerHTML=list.length?list.map(o=>{const p=profiles[o.customer_id]||{},idx=states.indexOf(o.status),next=idx>=0&&idx<states.length-1?states[idx+1]:null,finished=['completed','cancelled'].includes(o.status);return `<article class="order ${esc(o.status)}"><div class="toprow"><div><div class="code">${esc(o.code)}</div><div class="meta">${esc(fmt(o.created_at))} • ${esc(money(o.total))}</div></div><span class="status ${esc(o.status)}">${esc(labels[o.status]||o.status)}</span></div><div class="customer"><strong>${esc(p.full_name||o.pickup_name||'Cliente')}</strong>${p.phone?`<br>${esc(p.phone)}`:''}</div>${progress(o)}<div class="actions">${next&&!finished?`<button class="step primary" data-status="${next}" data-id="${esc(o.id)}">${o.status==='ready'?'Marcar como retirado':'Avançar: '+esc(labels[next])}</button>`:''}<button class="step" data-open="${esc(o.id)}">Ver detalhes</button>${!finished?`<button class="step cancel" data-cancel="${esc(o.id)}">Cancelar</button>`:''}</div><div class="detail hidden" id="d-${esc(o.id)}"><div class="detail-head"><strong>Detalhes do pedido</strong><span>${esc(o.pickup_mode==='night'?'Padoca Noturna':'Na padaria')}</span></div><div>${esc(o.pickup_date||'—')} • ${esc(String(o.pickup_time||'').slice(0,5)||'—')}</div><div>Status atual: ${esc(labels[o.status]||o.status)}</div><div class="detail-items" id="items-${esc(o.id)}"><span>Toque em “Ver detalhes” para carregar os itens.</span></div></div></article>`}).join(''):'<div class="empty">Nenhum pedido encontrado.</div>';document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>setStatus(b.dataset.id,b.dataset.status,b));document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancelOrder(b.dataset.cancel,b));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>toggleDetails(b.dataset.open))}
async function toggleDetails(id){const el=document.getElementById('d-'+id),items=document.getElementById('items-'+id);if(!el||!items)return;const opening=el.classList.contains('hidden');el.classList.toggle('hidden');if(!opening||items.dataset.loaded)return;items.innerHTML='<span>Carregando itens…</span>';const {data,error}=await sb.from('padoka_order_items').select('product_name,quantity,unit_price').eq('order_id',id).order('id');if(error){console.error(error);items.innerHTML='<span>Não foi possível carregar os itens agora.</span>';return}items.dataset.loaded='1';items.innerHTML=(data||[]).length?(data||[]).map(i=>`<div class="detail-item"><span>${esc(i.quantity)}× ${esc(i.product_name)}</span><strong>${esc(money(Number(i.quantity)*Number(i.unit_price)))}</strong></div>`).join(''):'<span>Nenhum item encontrado.</span>'}
function rpcMissing(error){const text=`${error?.code||''} ${error?.message||''} ${error?.details||''}`.toLowerCase();return error?.code==='PGRST202'||text.includes('padoka_update_order_status')&&(text.includes('schema cache')||text.includes('could not find')||text.includes('not found'))}
async function persistStatus(id,status){if(statusRpcAvailable!==false){const {error}=await sb.rpc('padoka_update_order_status',{p_order_id:id,p_status:status});if(!error){statusRpcAvailable=true;return}if(!rpcMissing(error))throw error;statusRpcAvailable=false}const {error}=await sb.from('padoka_orders').update({status}).eq('id',id);if(error)throw error}
async function setStatus(id,status,btn){if(busy)return;busy=true;const buttons=[...document.querySelectorAll('button[data-status],button[data-cancel]')];buttons.forEach(x=>x.disabled=true);if(btn)btn.textContent='Atualizando…';try{await persistStatus(id,status);toast('Status atualizado.');await reload()}catch(e){console.error(e);const text=String(e?.message||'').toLowerCase();toast(text.includes('invalid status transition')||text.includes('already finalized')?'O pedido mudou de etapa. Atualizando a fila…':'Não foi possível atualizar o pedido.');await reload()}finally{busy=false;buttons.forEach(x=>x.disabled=false)}}
async function cancelOrder(id,btn){if(!confirm('Cancelar este pedido? Esta ação ficará visível para o cliente.'))return;await setStatus(id,'cancelled',btn)}$('search').oninput=render;$('filter').onchange=render;init();
</script></body></html>
