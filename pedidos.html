<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pedidos • PADOKA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f2eee8;--paper:#fff;--ink:#17130f;--muted:#716960;--line:#e5ddd4;--dark:#15120f;--ok:#2f6b49;--danger:#9f4336}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}.wrap{width:min(1100px,calc(100% - 22px));margin:auto}.top{background:var(--dark);color:#fff}.bar{height:64px;display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px}.brand{font-weight:950}.brand small{display:block;color:#cfc3b8;font-size:9px}.back{margin-left:auto;color:#fff;border:1px solid #3a342f;border-radius:12px;padding:9px 11px;text-decoration:none;font-size:10px;font-weight:900}.head{padding:22px 0 10px;display:flex;justify-content:space-between;align-items:end;gap:12px}.head h1{margin:3px 0;font-size:31px}.head p{margin:0;color:var(--muted);font-size:11px}.demo{background:#fff1d5;color:#7d591e;border:1px solid #ead29b;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:950}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin:14px 0}.search,.filter{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff}.list{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-bottom:30px}.order{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.toprow{display:flex;justify-content:space-between;gap:10px}.code{font-weight:1000;font-size:14px}.status{border-radius:999px;padding:6px 8px;font-size:9px;font-weight:950;background:#eee7df;height:max-content}.meta,.customer{font-size:10px;color:var(--muted);line-height:1.5;margin-top:5px}.customer{padding-top:9px;border-top:1px solid var(--line);color:var(--ink)}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.step{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font-size:9px;font-weight:900}.step.active{background:var(--dark);color:#fff}.step.cancel{color:var(--danger)}.detail{margin-top:9px;background:#f8f5f1;border-radius:12px;padding:10px;font-size:9.5px;line-height:1.5}.hidden{display:none}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;text-align:center;color:var(--muted);font-size:10px}@media(max-width:760px){.list{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}}</style></head><body>
<header class="top"><div class="wrap bar"><img class="logo" src="assets/logo-padoka.svg" alt=""><div class="brand">PADOKA DA VILLA<small>PEDIDOS INTERNOS</small></div><a class="back" href="internal.html">← Painel ADM</a></div></header><main class="wrap"><section class="head"><div><small>OPERAÇÃO</small><h1>Pedidos</h1><p>Abra, filtre e atualize o andamento dos pedidos.</p></div><span class="demo hidden" id="demoBadge">MODO DEMONSTRAÇÃO</span></section><div class="toolbar"><input class="search" id="search" placeholder="Buscar código ou cliente"><select class="filter" id="filter"><option value="all">Todos</option><option value="received">Novos</option><option value="seen">Vistos</option><option value="confirmed">Confirmados</option><option value="preparing">Em preparo</option><option value="ready">Prontos</option><option value="completed">Concluídos</option><option value="cancelled">Cancelados</option></select></div><section class="list" id="list"></section></main><script>
const CONFIG_URL='https://yncspxfsvlqdnodlsosb.supabase.co/functions/v1/padoka-public-config',$=id=>document.getElementById(id);let sb,orders=[],profiles={},demo=sessionStorage.getItem('padoka_admin_demo')==='1';const labels={received:'Recebido',seen:'Visto pela padaria',confirmed:'Confirmado',preparing:'Em preparo',ready:'Pronto para retirada',completed:'Concluído',cancelled:'Cancelado'},steps=['seen','confirmed','preparing','ready','completed'];const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),fmt=v=>new Date(v).toLocaleString('pt-BR');function sample(){return[{id:'d1',code:'PDK-8F21A4',status:'received',pickup_name:'Mariana',total:32.8,created_at:new Date().toISOString(),pickup_mode:'store',pickup_date:'2026-08-19',pickup_time:'15:30',items:['2× Pão de Queijo','1× Cappuccino']},{id:'d2',code:'PDK-7C10D2',status:'preparing',pickup_name:'Rafael',total:21.5,created_at:new Date(Date.now()-18*60000).toISOString(),pickup_mode:'store',pickup_date:'2026-08-19',pickup_time:'16:00',items:['1× Coxinha','1× Suco Natural']},{id:'d3',code:'PDK-91B0E7',status:'ready',pickup_name:'Juliana',total:46.9,created_at:new Date(Date.now()-36*60000).toISOString(),pickup_mode:'night',pickup_date:'2026-08-20',pickup_time:'02:00',items:['1× Combo Noturno','1× Sonho Recheado']}]}function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value,list=orders.filter(o=>(f==='all'||o.status===f)&&(!q||`${o.code} ${o.pickup_name||profiles[o.customer_id]?.full_name||''}`.toLowerCase().includes(q)));$('list').innerHTML=list.length?list.map(o=>`<article class="order"><div class="toprow"><div><div class="code">${o.code}</div><div class="meta">${fmt(o.created_at)} • ${money(o.total)}<br>${o.pickup_mode==='night'?'🌙 Padoca Noturna':'🏪 Retirada'} • ${o.pickup_date||''} ${String(o.pickup_time||'').slice(0,5)}</div></div><span class="status">${labels[o.status]||o.status}</span></div><div class="customer"><strong>${profiles[o.customer_id]?.full_name||o.pickup_name||'Cliente'}</strong></div><div class="actions"><button class="step" data-open="${o.id}">Abrir pedido</button></div><div class="detail hidden" id="detail-${o.id}"><strong>Itens</strong><div id="items-${o.id}" style="margin:6px 0">${demo?(o.items||[]).join('<br>'):'Carregando…'}</div><div class="actions">${steps.map(s=>`<button class="step ${o.status===s?'active':''}" data-status="${s}" data-id="${o.id}">${labels[s]}</button>`).join('')}<button class="step cancel" data-status="cancelled" data-id="${o.id}">Cancelar</button></div></div></article>`).join(''):'<div class="empty">Nenhum pedido encontrado.</div>';$('list').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openOrder(b.dataset.open));$('list').querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>setStatus(b.dataset.id,b.dataset.status))}
async function openOrder(id){const d=$('detail-'+id);d.classList.toggle('hidden');if(demo||d.classList.contains('hidden'))return;const o=orders.find(x=>x.id===id);if(o?.status==='received')await setStatus(id,'seen');const {data}=await sb.from('padoka_order_items').select('product_name,quantity,unit_price').eq('order_id',id);$('items-'+id).innerHTML=(data||[]).map(i=>`${i.quantity}× ${i.product_name} — ${money(i.quantity*i.unit_price)}`).join('<br>')||'Sem itens.'}
async function setStatus(id,status){if(demo){const o=orders.find(x=>x.id===id);if(o)o.status=status;render();return}const {error}=await sb.from('padoka_orders').update({status}).eq('id',id);if(error)return alert('Não foi possível atualizar.');await loadReal()}
async function loadReal(){const {data,error}=await sb.from('padoka_orders').select('*').order('created_at',{ascending:false}).limit(200);if(error){$('list').innerHTML='<div class="empty">Falha ao carregar pedidos.</div>';return}orders=data||[];const ids=[...new Set(orders.map(o=>o.customer_id).filter(Boolean))];if(ids.length){const {data:p}=await sb.from('padoka_profiles').select('id,full_name').in('id',ids);(p||[]).forEach(x=>profiles[x.id]=x)}render()}
(async()=>{if(demo){$('demoBadge').classList.remove('hidden');orders=sample();render();return}try{const r=await fetch(CONFIG_URL,{cache:'no-store'}),c=await r.json();sb=window.supabase.createClient(c.url,c.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{session}}=await sb.auth.getSession();if(!session)return location.replace('internal.html');const {data:s}=await sb.from('padoka_staff_users').select('active').eq('user_id',session.user.id).maybeSingle();if(!s?.active)return location.replace('internal.html');await loadReal()}catch(e){console.error(e);location.replace('internal.html')}})();$('search').oninput=render;$('filter').onchange=render;
</script></body></html>
