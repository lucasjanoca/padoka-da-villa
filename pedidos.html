<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#15120f"><title>Pedidos • PADOKA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f2eee8;--paper:#fff;--ink:#17130f;--muted:#716960;--line:#e5ddd4;--dark:#15120f;--brand:#a86f3d;--ok:#2f6b49;--danger:#9f4336}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}.top{height:66px;background:var(--dark);color:#fff;position:sticky;top:0;z-index:40}.wrap{width:min(1220px,calc(100% - 22px));margin:auto}.bar{height:100%;display:flex;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;font-weight:950}.logo{width:42px;height:42px}.brand small{display:block;color:#cfc3b8;font-size:9px}.menu{margin-left:auto;width:40px;height:40px;border:1px solid #3a342f;background:#25211d;color:#fff;border-radius:11px;font-size:19px}.drawer{position:fixed;right:-290px;top:0;width:280px;height:100dvh;background:#17130f;color:#fff;z-index:80;padding:18px;transition:.22s}.drawer.open{right:0}.drawer a{display:block;color:#c9c0b8;padding:12px;border-radius:11px;font-size:11px;font-weight:850;text-decoration:none}.drawer a:hover{background:#2a241f;color:#fff}.overlay{display:none}.overlay.open{display:block;position:fixed;inset:0;background:#0009;z-index:70}.close{width:35px;height:35px;border:0;border-radius:10px;background:#2a241f;color:#fff;float:right}.head{padding:22px 0 10px;display:flex;justify-content:space-between;align-items:end;gap:12px}.head h1{margin:3px 0;font-size:32px}.head p{margin:0;color:var(--muted);font-size:11px}.live{background:#e5f1e9;color:#285b3e;border:1px solid #cde2d4;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:950}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin:14px 0}.search,.filter{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-bottom:30px}.order{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 8px 24px #2a1d1208}.order.received{border-left:4px solid #d29b3e}.order.ready{border-left:4px solid #3c8c5c}.toprow{display:flex;justify-content:space-between;gap:10px}.code{font-weight:1000;font-size:14px}.status{border-radius:999px;padding:6px 8px;font-size:9px;font-weight:950;background:#eee7df;height:max-content}.meta,.customer{font-size:10px;color:var(--muted);line-height:1.5;margin-top:5px}.customer{padding-top:9px;border-top:1px solid var(--line);color:var(--ink)}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:12px}.flow div{height:5px;border-radius:999px;background:#e6ddd5}.flow div.done{background:var(--dark)}.flow div.current{background:var(--brand)}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.step{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;font-size:9px;font-weight:900;cursor:pointer}.step.primary{background:var(--dark);color:#fff;border-color:var(--dark)}.step.cancel{color:var(--danger)}.detail{margin-top:9px;background:#f8f5f1;border-radius:12px;padding:10px;font-size:9.5px;line-height:1.5}.hidden{display:none!important}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;text-align:center;color:var(--muted);font-size:10px}@media(max-width:800px){.list{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.toolbar{grid-template-columns:1fr}.flow{gap:2px}}@media(max-width:480px){.wrap{width:min(100% - 14px,1220px)}.order{padding:12px}.actions{display:grid;grid-template-columns:1fr 1fr}.step{padding:10px 7px}}</style></head><body><header class="top"><div class="wrap bar"><a class="brand" href="index.html#cardapio"><img class="logo" src="assets/logo-padoka.svg" alt="PADOKA"><span>PADOKA DA VILLA<small>PEDIDOS DA EQUIPE</small></span></a><button class="menu" id="menu">☰</button></div></header><div class="overlay" id="overlay"></div><aside class="drawer" id="drawer"><button class="close" id="close">×</button><div style="clear:both;padding:12px 8px;font-weight:1000">Navegação</div><a href="internal.html">Visão geral</a><a href="pedidos.html">Pedidos</a><a href="pdv.html">Caixa / PDV</a><a href="gestao.html?tab=produtos">Produtos</a><a href="gestao.html?tab=estoque">Estoque</a><a href="gestao.html?tab=producao">Produção</a><a href="gestao.html?tab=perdas">Perdas</a><a href="gestao.html?tab=relatorios">Relatórios</a><a href="gestao.html?tab=configuracoes">Configurações</a><a href="index.html#cardapio">Cardápio do cliente</a></aside><main class="wrap"><section class="head"><div><small>OPERAÇÃO</small><h1>Pedidos</h1><p>A equipe controla o andamento que o cliente acompanha em tempo real.</p></div><span class="live">ATUALIZAÇÃO EM TEMPO REAL</span></section><div class="toolbar"><input class="search" id="search" placeholder="Buscar código ou cliente"><select class="filter" id="filter"><option value="all">Todos</option><option value="received">Novos</option><option value="seen">Vistos</option><option value="confirmed">Confirmados</option><option value="preparing">Em preparo</option><option value="ready">Prontos</option><option value="completed">Concluídos</option></select></div><section class="list" id="list"></section></main><script>const CONFIG_URL='https://yncspxfsvlqdnodlsosb.supabase.co/functions/v1/padoka-public-config',$=id=>document.getElementById(id);let sb=null,orders=[],profiles={},channel=null;const states=['received','seen','confirmed','preparing','ready','completed'],labels={received:'Recebido',seen:'Visto pela padaria',confirmed:'Confirmado',preparing:'Em preparo',ready:'Pronto para retirada',completed:'Concluído',cancelled:'Cancelado'};const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function progress(o){const idx=states.indexOf(o.status);return `<div class="flow">${states.map((s,i)=>`<div class="${o.status!=='cancelled'&&i<=idx?'done':''} ${o.status===s?'current':''}"></div>`).join('')}</div>`}async function init(){try{const r=await fetch(CONFIG_URL,{cache:'no-store'}),c=await r.json();sb=window.supabase.createClient(c.url,c.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{session}}=await sb.auth.getSession();if(!session)return $('list').innerHTML='<div class="empty">Entre pelo painel administrativo.</div>';const {data:s}=await sb.from('padoka_staff_users').select('active').eq('user_id',session.user.id).maybeSingle();if(!s?.active)return $('list').innerHTML='<div class="empty">Acesso interno não autorizado.</div>';await reload();channel=sb.channel('padoka-orders-ui').on('postgres_changes',{event:'*',schema:'public',table:'padoka_orders'},reload).subscribe()}catch(e){console.error(e);$('list').innerHTML='<div class="empty">Não foi possível carregar os pedidos.</div>'}}async function reload(){const {data}=await sb.from('padoka_orders').select('*').order('created_at',{ascending:false}).limit(200);orders=data||[];const ids=[...new Set(orders.map(o=>o.customer_id).filter(Boolean))];profiles={};if(ids.length){const {data:p}=await sb.from('padoka_profiles').select('id,full_name,phone').in('id',ids);(p||[]).forEach(x=>profiles[x.id]=x)}render()}function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const list=orders.filter(o=>{const p=profiles[o.customer_id]||{};return (f==='all'||o.status===f)&&(!q||(`${o.code} ${p.full_name||o.pickup_name||''}`).toLowerCase().includes(q))});$('list').innerHTML=list.length?list.map(o=>{const p=profiles[o.customer_id]||{},idx=states.indexOf(o.status),next=states[Math.min(idx+1,states.length-1)];return `<article class="order ${o.status}"><div class="toprow"><div><div class="code">${o.code}</div><div class="meta">${new Date(o.created_at).toLocaleString('pt-BR')} • ${money(o.total)}</div></div><span class="status">${labels[o.status]||o.status}</span></div><div class="customer"><strong>${p.full_name||o.pickup_name||'Cliente'}</strong><br>${p.phone||''}</div>${progress(o)}<div class="actions">${o.status!=='completed'&&o.status!=='cancelled'?`<button class="step primary" data-status="${next}" data-id="${o.id}">${o.status==='ready'?'Marcar como retirado':'Avançar: '+labels[next]}</button>`:''}<button class="step" data-open="${o.id}">Ver detalhes</button><button class="step cancel" data-status="cancelled" data-id="${o.id}">Cancelar</button></div><div class="detail hidden" id="d-${o.id}">Retirada: ${o.pickup_mode==='night'?'Padoca Noturna':'Na padaria'}<br>${o.pickup_date} • ${String(o.pickup_time||'').slice(0,5)}<br>Status atual: ${labels[o.status]}</div></article>`}).join(''):'<div class="empty">Nenhum pedido encontrado.</div>';document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>setStatus(b.dataset.id,b.dataset.status));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>document.getElementById('d-'+b.dataset.open).classList.toggle('hidden'))}async function setStatus(id,status){const {error}=await sb.from('padoka_orders').update({status}).eq('id',id);if(error)return alert('Não foi possível atualizar: '+error.message);await reload()}$('search').oninput=render;$('filter').onchange=render;$('menu').onclick=()=>{$('drawer').classList.add('open');$('overlay').classList.add('open')};function close(){ $('drawer').classList.remove('open');$('overlay').classList.remove('open')}$('close').onclick=close;$('overlay').onclick=close;init();</script></body></html>
