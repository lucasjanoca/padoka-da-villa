<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#15120f"><title>Pedidos internos • PADOKA DA VILLA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f2eee8;--paper:#fff;--ink:#17130f;--muted:#716960;--line:#e5ddd4;--dark:#15120f;--ok:#2f6b49;--warn:#9b6a26;--danger:#9f4336}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}.wrap{width:min(1040px,calc(100% - 22px));margin:auto}.top{background:var(--dark);color:#fff;position:sticky;top:0;z-index:20}.bar{height:64px;display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;object-fit:contain}.brand{font-weight:950}.brand small{display:block;color:#cfc3b8;font-size:10px}.back{margin-left:auto;color:#fff;border:1px solid #3a342f;background:#25211d;border-radius:12px;padding:9px 11px;text-decoration:none;font-size:11px;font-weight:900}.head{padding:22px 0 10px}.head h1{margin:4px 0;font-size:30px}.head p{margin:0;color:var(--muted);font-size:12px}.live{display:inline-flex;align-items:center;gap:6px;background:#e4f2e8;color:#285b3d;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:900;margin-top:10px}.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#3d8c5c}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin:14px 0}.search{border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff;min-width:0}.filter{border:1px solid var(--line);border-radius:13px;padding:0 11px;background:#fff}.list{display:grid;gap:10px;padding-bottom:30px}.order{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.04)}.order-top{display:flex;justify-content:space-between;gap:10px;align-items:start}.code{font-weight:1000;font-size:14px}.status{border-radius:999px;padding:6px 8px;font-size:9px;font-weight:1000;background:#eee7df}.status.seen{background:#e7edf7;color:#334f76}.status.preparing{background:#fff0d2;color:#79551b}.status.ready,.status.completed{background:#e2f1e7;color:#275a3c}.status.cancelled{background:#f6e3df;color:#843c31}.meta{font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:4px}.customer{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;line-height:1.45}.row{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.step{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 9px;font-size:9.5px;font-weight:900;cursor:pointer}.step.active{background:var(--dark);color:#fff;border-color:var(--dark)}.step.cancel{color:var(--danger)}.open{background:#15120f;color:#fff;border:0;border-radius:11px;padding:9px 11px;font-size:9.5px;font-weight:900}.detail{margin-top:10px;background:#f8f5f1;border-radius:12px;padding:10px;font-size:10px;line-height:1.55}.items{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}.item{display:flex;justify-content:space-between;gap:10px;padding:3px 0}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;text-align:center;color:var(--muted);padding:28px 15px;font-size:11px}.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d49a34;margin-right:5px}.hidden{display:none!important}.loading{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:60}.loader{width:35px;height:35px;border:3px solid #ddd4ca;border-top-color:#15120f;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:760px){.list{grid-template-columns:1fr 1fr}.head h1{font-size:36px}}
</style></head><body><div class="loading" id="loading"><div class="loader"></div></div><header class="top"><div class="wrap bar"><img class="logo" src="assets/logo-padoka.svg" alt="PADOKA DA VILLA"><div class="brand">PADOKA DA VILLA<small>Painel interno • Pedidos</small></div><a class="back" href="internal.html">Painel</a></div></header><main class="wrap"><section class="head"><small>OPERAÇÃO</small><h1>Pedidos</h1><p>Fila real da PADOKA. Abra o pedido para registrar que a equipe visualizou.</p><div class="live">Atualização em tempo real</div></section><div class="toolbar"><input class="search" id="search" placeholder="Buscar código, cliente ou telefone"><select class="filter" id="filter"><option value="all">Todos</option><option value="received">Novos</option><option value="seen">Vistos</option><option value="confirmed">Confirmados</option><option value="preparing">Em preparo</option><option value="ready">Prontos</option><option value="completed">Concluídos</option><option value="cancelled">Cancelados</option></select></div><section class="list" id="list"></section></main><script>
const CONFIG_URL='https://yncspxfsvlqdnodlsosb.supabase.co/functions/v1/padoka-public-config',$=id=>document.getElementById(id);let sb=null,user=null,staff=null,orders=[],profiles={},channel=null;const labels={received:'Recebido',seen:'Visto pela padaria',confirmed:'Confirmado',preparing:'Em preparo',ready:'Pronto para retirada',completed:'Concluído',cancelled:'Cancelado'},steps=['seen','confirmed','preparing','ready','completed'];
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function fmt(v){return v?new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—'}
async function init(){try{const r=await fetch(CONFIG_URL,{cache:'no-store'});const c=await r.json();sb=window.supabase.createClient(c.url,c.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{session}}=await sb.auth.getSession();user=session?.user||null;if(!user)return deny('Entre no painel interno primeiro.');const {data:s}=await sb.from('padoka_staff_users').select('role,active').eq('user_id',user.id).maybeSingle();staff=s;if(!staff?.active)return deny('Esta conta não possui permissão de equipe PADOKA.');await reload();channel=sb.channel('padoka-staff-orders').on('postgres_changes',{event:'*',schema:'public',table:'padoka_orders'},reload).subscribe()}catch(e){console.error(e);deny('Não foi possível conectar ao painel de pedidos.')}finally{$('loading').classList.add('hidden')}}
function deny(msg){$('list').innerHTML=`<div class="empty">${msg}<br><br><a href="internal.html" style="font-weight:900">Voltar ao acesso interno</a></div>`}
async function reload(){const {data,error}=await sb.from('padoka_orders').select('*').order('created_at',{ascending:false}).limit(200);if(error)return deny('Falha ao carregar pedidos.');orders=data||[];const ids=[...new Set(orders.map(o=>o.customer_id))];profiles={};if(ids.length){const {data:p}=await sb.from('padoka_profiles').select('id,full_name,phone').in('id',ids);(p||[]).forEach(x=>profiles[x.id]=x)}render()}
function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const list=orders.filter(o=>{const p=profiles[o.customer_id]||{};const text=`${o.code} ${p.full_name||''} ${p.phone||''}`.toLowerCase();return (f==='all'||o.status===f)&&(!q||text.includes(q))});$('list').innerHTML=list.length?list.map(o=>{const p=profiles[o.customer_id]||{};return `<article class="order"><div class="order-top"><div><div class="code">${o.status==='received'?'<span class="pulse"></span>':''}${o.code}</div><div class="meta">${fmt(o.created_at)} • ${money(o.total)} ${o.is_test?'• TESTE':''}<br>${o.pickup_mode==='night'?'🌙 Padoca Noturna':'🏪 Retirada na padaria'} • ${o.pickup_date} ${String(o.pickup_time).slice(0,5)}</div></div><span class="status ${o.status}">${labels[o.status]||o.status}</span></div><div class="customer"><strong>${p.full_name||o.pickup_name}</strong><br>${p.phone||'Telefone não encontrado no perfil'}</div><div class="row"><button class="open" data-open="${o.id}" type="button">Abrir pedido</button></div><div class="detail hidden" id="detail-${o.id}"><strong>Andamento</strong><br>Recebido: ${fmt(o.created_at)}<br>Visto: ${fmt(o.seen_at)}<br>Confirmado: ${fmt(o.confirmed_at)}<br>Em preparo: ${fmt(o.preparing_at)}<br>Pronto: ${fmt(o.ready_at)}<div class="items" id="items-${o.id}">Carregando itens…</div><div class="row">${steps.map(s=>`<button class="step ${o.status===s?'active':''}" data-status="${s}" data-id="${o.id}">${labels[s]}</button>`).join('')}<button class="step cancel" data-status="cancelled" data-id="${o.id}">Cancelar</button></div></div></article>`}).join(''):'<div class="empty">Nenhum pedido encontrado.</div>';$('list').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openOrder(b.dataset.open));$('list').querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>setStatus(b.dataset.id,b.dataset.status))}
async function openOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;const d=$('detail-'+id);d.classList.toggle('hidden');if(!d.classList.contains('hidden')){if(o.status==='received')await setStatus(id,'seen',false);const {data}=await sb.from('padoka_order_items').select('product_name,quantity,unit_price').eq('order_id',id).order('id');$('items-'+id).innerHTML=(data||[]).map(i=>`<div class="item"><span>${Number(i.quantity)}× ${i.product_name}</span><strong>${money(Number(i.quantity)*Number(i.unit_price))}</strong></div>`).join('')||'Sem itens.'}}
async function setStatus(id,status,refresh=true){const {error}=await sb.from('padoka_orders').update({status}).eq('id',id);if(error){alert('Não foi possível atualizar o pedido: '+error.message);return}if(refresh)await reload()}
$('search').oninput=render;$('filter').onchange=render;window.addEventListener('beforeunload',()=>{if(channel&&sb)sb.removeChannel(channel)});init();
</script></body></html>
