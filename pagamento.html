<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15120f"><title>Finalizar pedido • PADOKA DA VILLA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#f5efe7;--paper:#fffdf9;--ink:#17130f;--muted:#776e65;--line:#e7dbcf;--dark:#15120f;--ok:#2f6b49;--warn:#805d22}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}button{font:inherit}.wrap{width:min(620px,calc(100% - 22px));margin:auto}.top{background:var(--dark);color:#fff}.bar{height:62px;display:flex;align-items:center;gap:10px}.brand-link{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}.logo{width:42px;height:42px;object-fit:contain}.brand{font-weight:950}.brand small{display:block;color:#cfc3b8;font-size:10px}.back{margin-left:auto;border:1px solid #3a342f;background:#25211d;color:#fff;border-radius:12px;padding:9px 11px;font-size:11px;font-weight:900}.hero{padding:22px 0 6px}.hero h1{font-size:31px;margin:5px 0}.hero p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.card{background:var(--paper);border:1px solid var(--line);border-radius:21px;padding:17px;margin:12px 0;box-shadow:0 9px 25px rgba(42,29,18,.06)}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:11px}.row:last-child{border:0}.row span{color:var(--muted)}.total{font-size:19px;font-weight:1000}.notice{border-radius:14px;padding:11px 12px;font-size:10.5px;line-height:1.45}.notice.warn{background:#fff4d8;border:1px solid #ecd49b;color:#76581f}.notice.ok{background:#e7f3eb;border:1px solid #cde5d5;color:#27593c}.account{display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:1000;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.account strong{font-size:12px}.account small{display:block;color:var(--muted);font-size:10px;margin-top:2px;overflow-wrap:anywhere}.actions{display:grid;gap:8px;margin:14px 0 26px}.btn{border:0;border-radius:14px;padding:13px;font-weight:950;text-align:center;cursor:pointer}.btn.dark{background:var(--dark);color:#fff}.btn.soft{background:#eee5dc}.btn:disabled{opacity:.45;cursor:not-allowed}.items{margin-top:8px}.item{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:10px}.item:last-child{border:0}.loading{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50}.loader{width:35px;height:35px;border:3px solid #e2d7cc;border-top-color:var(--dark);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none!important}@media(min-width:700px){.card{padding:22px}.hero h1{font-size:38px}}
</style></head><body><div class="loading" id="loading"><div class="loader"></div></div><header class="top"><div class="wrap bar"><a class="brand-link" href="index.html#cardapio"><img class="logo" src="assets/logo-padoka.svg" alt="PADOKA DA VILLA"><div class="brand">PADOKA DA VILLA<small>Finalizar pedido</small></div></a><a class="back" href="index.html">Voltar</a></div></header><main class="wrap"><section class="hero"><small>CHECKOUT</small><h1>Revise antes de enviar.</h1><p>Seu pedido será vinculado à sua conta PADOKA e validado pelo catálogo do servidor.</p></section><section class="card" id="summary"></section><section class="card" id="accountCard"></section><div class="actions"><button class="btn dark" id="sendOrder" type="button">Enviar pedido</button><a class="btn soft" href="index.html#cardapio">Editar pedido</a></div></main><script>
const CONFIG_URL='https://yncspxfsvlqdnodlsosb.supabase.co/functions/v1/padoka-public-config',PICKUP_KEY='padoka_pickup',CART_KEY='padoka_cart_mobile_v1';const $=id=>document.getElementById(id);let sb=null,user=null,profile=null,pickup=null,catalog={};
function get(k,f=null){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safeAvatarUrl(v){if(!v)return '';try{const u=new URL(String(v),location.href);return u.protocol==='https:'?u.href:''}catch{return ''}}
function buildItems(){const cart=pickup?.cart||{};return Object.entries(cart).filter(([id,q])=>catalog[id]&&Number(q)>0).map(([id,q])=>({product_id:id,quantity:Number(q),product_name:catalog[id].name,unit_price:Number(catalog[id].price)}))}
async function init(){try{pickup=get(PICKUP_KEY);const r=await fetch(CONFIG_URL,{cache:'no-store'});if(!r.ok)throw new Error('config');const cfg=await r.json();sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const [{data:products,error:productError},{data:{session}}]=await Promise.all([sb.from('padoka_products').select('id,name,price,is_demo').eq('active',true).order('sort_order'),sb.auth.getSession()]);if(productError)throw productError;catalog=Object.fromEntries((products||[]).map(p=>[p.id,p]));renderSummary();user=session?.user||null;if(user){const {data}=await sb.from('padoka_profiles').select('*').eq('id',user.id).maybeSingle();profile=data}renderAccount()}catch(e){$('summary').innerHTML='<div class="notice warn">Não foi possível carregar o catálogo agora. Tente novamente em instantes.</div>';$('accountCard').innerHTML='<div class="notice warn">Não foi possível conectar ao serviço de contas agora.</div>';$('sendOrder').disabled=true;console.error(e)}finally{$('loading').classList.add('hidden')}}
function renderSummary(){if(!pickup){$('summary').innerHTML='<div class="notice warn"><strong>Nenhum pedido em revisão.</strong><br>Volte ao cardápio e monte seu carrinho.</div>';$('sendOrder').disabled=true;return}const items=buildItems(),cartCount=Object.entries(pickup.cart||{}).filter(([,q])=>Number(q)>0).length;if(!items.length||items.length!==cartCount){$('summary').innerHTML='<div class="notice warn"><strong>O carrinho mudou.</strong><br>Um item não está mais disponível no catálogo atual. Volte ao cardápio para revisar.</div>';$('sendOrder').disabled=true;return}const total=items.reduce((s,i)=>s+i.quantity*i.unit_price,0),pickupLabel=pickup.mode==='noturna'?'Padoca Noturna':'Na padaria';$('summary').innerHTML=`<h2 style="margin:0 0 6px">Resumo</h2><div class="row"><span>Retirada</span><strong>${esc(pickupLabel)}</strong></div><div class="row"><span>Data e horário</span><strong>${esc(pickup.date||'—')} • ${esc(pickup.time||'—')}</strong></div><div class="row"><span>Nome para retirada</span><strong>${esc(pickup.name||'—')}</strong></div><div class="items">${items.map(i=>`<div class="item"><span>${esc(i.quantity)}× ${esc(i.product_name)}</span><strong>${esc(money(i.quantity*i.unit_price))}</strong></div>`).join('')}</div><div class="row"><span>Total</span><strong class="total">${esc(money(total))}</strong></div><div class="notice ok" style="margin-top:10px"><strong>Valores conferidos.</strong><br>Os preços são validados diretamente pelo catálogo.</div>`}
function renderAccount(){if(!user||!profile?.onboarding_completed){$('accountCard').innerHTML='<h2 style="margin:0 0 5px;font-size:17px">Entre na sua conta PADOKA</h2><p style="margin:0;color:var(--muted);font-size:10.5px;line-height:1.45">O pedido precisa de uma conta para ficar vinculado somente a você.</p><a class="btn dark" style="display:block;margin-top:12px" href="conta.html">Entrar / criar conta</a>';$('sendOrder').disabled=true;return}const displayName=String(profile?.full_name||'Cliente').trim()||'Cliente',email=String(user?.email||''),phone=String(profile?.phone||''),pic=safeAvatarUrl(user?.user_metadata?.avatar_url||user?.user_metadata?.picture),avatar=pic?`<img src="${esc(pic)}" alt="Foto do perfil">`:esc(displayName.charAt(0).toUpperCase());$('accountCard').innerHTML=`<div class="account"><div class="avatar">${avatar}</div><div><strong>${esc(displayName)}</strong><small>${esc(email)} • ${esc(phone)}</small></div></div><div class="notice ok" style="margin-top:12px"><strong>Conta vinculada.</strong><br>O pedido aparecerá em “Meus pedidos” e no painel interno da PADOKA.</div>`;$('sendOrder').disabled=!pickup||buildItems().length===0}
$('sendOrder').onclick=async()=>{if(!sb||!user||!profile||!pickup)return;const btn=$('sendOrder');btn.disabled=true;btn.textContent='Enviando…';const mode=pickup.mode==='noturna'?'night':'store',items=buildItems().map(i=>({product_id:i.product_id,quantity:i.quantity}));const {data,error}=await sb.rpc('padoka_create_order',{p_pickup_mode:mode,p_pickup_date:pickup.date,p_pickup_time:pickup.time,p_pickup_name:pickup.name,p_items:items});if(error){console.error(error);btn.disabled=false;btn.textContent='Enviar pedido';$('accountCard').insertAdjacentHTML('beforeend',`<div class="notice warn" style="margin-top:10px">Não foi possível enviar o pedido. Revise o carrinho e tente novamente.</div>`);return}const order=Array.isArray(data)?data[0]:data;localStorage.removeItem(CART_KEY);localStorage.removeItem(PICKUP_KEY);location.href='acompanhamento.html?code='+encodeURIComponent(order.code)};init();
</script><script src="assets/order-idempotency.js"></script></body></html>
