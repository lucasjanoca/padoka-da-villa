<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#15120f"><title>Gestão • PADOKA</title><link rel="stylesheet" href="assets/internal-nav.css"><style>:root{--bg:#f3eee8;--paper:#fff;--ink:#17130f;--muted:#776f67;--line:#e5ddd4;--dark:#15120f;--brand:#a86f3d;--ok:#2f6b49}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}a{text-decoration:none;color:inherit}.wrap{width:min(1280px,calc(100% - 22px));margin:auto}.page{padding:20px 0 30px}.hero{display:flex;justify-content:space-between;gap:12px;align-items:end}.hero h1{margin:4px 0;font-size:30px}.hero p{margin:0;color:var(--muted);font-size:11px}.mode{background:#fff1d5;color:#7d591e;border:1px solid #ead29b;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:950}.tabs{display:flex;gap:6px;overflow:auto;padding:14px 0 8px;scrollbar-width:none}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:10px;font-weight:900}.tab.active{background:var(--dark);color:#fff}.panel{display:none}.panel.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:16px;margin-top:10px;box-shadow:0 10px 28px #2b1d100b}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.search{flex:1;min-width:210px;border:1px solid var(--line);border-radius:12px;padding:11px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.product{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fff}.product img{width:100%;aspect-ratio:1.55/1;object-fit:cover}.pcopy{padding:10px}.pcopy strong{font-size:11px}.pcopy small{display:block;color:var(--muted);font-size:8.5px;margin-top:3px}.price{font-size:13px;font-weight:950;margin-top:7px}.price span{font-size:8px;color:var(--brand)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{border-bottom:1px solid var(--line);padding:9px 7px;text-align:left;font-size:9.5px}.table input{width:100%;min-width:80px;border:1px solid var(--line);border-radius:8px;padding:7px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.stat small{font-size:8px;color:var(--muted)}.stat strong{display:block;font-size:23px;margin-top:6px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.formgrid label{font-size:9px;font-weight:900}.formgrid input,.formgrid select,.formgrid textarea{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:11px;padding:10px;background:#fff}.full{grid-column:1/-1}.btn{border:0;border-radius:11px;padding:10px 13px;background:var(--dark);color:#fff;font-size:9.5px;font-weight:950}.notice{background:#fff4d8;border:1px solid #ead49d;color:#77591f;border-radius:13px;padding:10px;font-size:9px;line-height:1.5;margin-top:10px}.status{border-radius:999px;padding:5px 7px;background:#eee7e0;font-size:8px;font-weight:900}.status.ok{background:#e4f1e8;color:#285b3e}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#15120f;color:#fff;padding:10px 14px;border-radius:12px;font-size:10px;z-index:90}.hidden{display:none}@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:1fr 1fr}}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.hero{align-items:start;flex-direction:column}}@media(max-width:420px){.wrap{width:min(100% - 14px,1280px)}.card{padding:12px}.stats{gap:7px}.stat{padding:11px}}</style></head><body><div id="padokaInternalNav" data-current="produtos" data-subtitle="GESTÃO OPERACIONAL"></div><main class="wrap page"><div class="hero"><div><small>CONTROLE INTERNO</small><h1 id="title">Produtos</h1><p id="subtitle">Catálogo compartilhado com cliente e PDV.</p></div><span class="mode">MODO PREPARAÇÃO</span></div><nav class="tabs" id="tabs"></nav><section class="panel" data-panel="produtos"><div class="card"><div class="toolbar"><input class="search" id="prodSearch" placeholder="Buscar produto, categoria ou código"><a class="btn" href="pdv.html">Abrir PDV</a></div><div class="grid" id="prodGrid"></div></div></section><section class="panel" data-panel="estoque"><div class="stats"><div class="stat"><small>PRODUTOS</small><strong id="stockProducts">0</strong></div><div class="stat"><small>COM CÓDIGO</small><strong id="stockCodes">0</strong></div><div class="stat"><small>ESTOQUE BAIXO</small><strong id="stockLow">0</strong></div><div class="stat"><small>PENDENTES</small><strong id="stockPending">0</strong></div></div><div class="card"><h3>Estoque e código de barras</h3><div class="tablewrap" id="stockTable"></div></div></section><section class="panel" data-panel="producao"><div class="card"><h3>Planejamento de produção</h3><div class="tablewrap" id="productionTable"></div></div></section><section class="panel" data-panel="perdas"><div class="card"><h3>Registrar perda</h3><div class="formgrid"><label>Produto<select id="lossProduct"></select></label><label>Quantidade<input id="lossQty" type="number" min="0.01" step="0.01" value="1"></label><label>Motivo<select id="lossReason"><option>Vencimento</option><option>Quebra / avaria</option><option>Sobra de produção</option><option>Erro de preparo</option><option>Outro</option></select></label><label>Observação<input id="lossNote"></label><div class="full"><button class="btn" id="lossSave">Registrar perda demonstrativa</button></div></div></div><div class="card"><h3>Histórico</h3><div id="lossList"></div></div></section><section class="panel" data-panel="relatorios"><div class="stats"><div class="stat"><small>CATÁLOGO</small><strong id="rProducts">0</strong></div><div class="stat"><small>POR PESO</small><strong id="rWeight">0</strong></div><div class="stat"><small>PERDAS</small><strong id="rLoss">0</strong></div><div class="stat"><small>CÓDIGOS</small><strong id="rCodes">0</strong></div></div></section><section class="panel" data-panel="configuracoes"><div class="card"><h3>Configurações</h3><div class="formgrid"><label>Abertura<input id="cfgOpen" type="time" value="05:00"></label><label>Fechamento<input id="cfgClose" type="time" value="18:00"></label><label>Padoca Noturna<input id="cfgNight" type="time" value="02:00"></label><label>Pagamento<select id="cfgPayment"><option>Pix</option><option>Dinheiro</option><option>Cartão</option></select></label><label class="full">Observação<textarea id="cfgNote" rows="3"></textarea></label><div class="full"><button class="btn" id="cfgSave">Salvar neste navegador</button></div></div></div></section></main><div class="toast hidden" id="toast"></div><script src="assets/catalog.js"></script><script src="assets/internal-nav.js"></script><script>const $=id=>document.getElementById(id),catalog=window.PADOKA_CATALOG||[];const tabs=[['produtos','Produtos','Catálogo compartilhado com cliente e PDV.'],['estoque','Estoque','Códigos de barras e saldo.'],['producao','Produção','Planejamento de fornadas.'],['perdas','Perdas','Registro de desperdícios.'],['relatorios','Relatórios','Resumo operacional.'],['configuracoes','Configurações','Horários e preferências.']];let stock=JSON.parse(localStorage.getItem('padoka_demo_stock')||'{}'),production=JSON.parse(localStorage.getItem('padoka_demo_production')||'{}'),losses=JSON.parse(localStorage.getItem('padoka_demo_losses')||'[]');const money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),1500)}function tab(){return new URLSearchParams(location.search).get('tab')||'produtos'}function syncNav(){const n=$('padokaInternalNav');if(n)n.dataset.current=tab()}function drawTabs(){const a=tab();$('tabs').innerHTML=tabs.map(([id,n])=>`<a class="tab ${id===a?'active':''}" href="?tab=${id}">${n}</a>`).join('');document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.dataset.panel===a));const t=tabs.find(x=>x[0]===a)||tabs[0];$('title').textContent=t[1];$('subtitle').textContent=t[2]}function renderProducts(){const q=$('prodSearch').value.trim().toLowerCase(),list=catalog.filter(p=>!q||(`${p.name} ${p.category} ${p.id}`).toLowerCase().includes(q));$('prodGrid').innerHTML=list.map(p=>`<article class="product"><img src="${p.img}" alt="${p.name}" onerror="this.src='assets/logo-padoka.svg'"><div class="pcopy"><strong>${p.name}</strong><small>${p.category} • ${p.id}</small><div class="price">${money(p.price)} <span>/ ${p.unit}</span></div></div></article>`).join('')}function saveStock(){localStorage.setItem('padoka_demo_stock',JSON.stringify(stock));renderStock();renderReports()}function renderStock(){const rows=catalog.map(p=>{const s=stock[p.id]||{};return `<tr><td><strong>${p.name}</strong><br><small>${p.id}</small></td><td>${p.unit}</td><td><input data-code="${p.id}" value="${s.code||''}" placeholder="Bipe o EAN"></td><td><input data-qty="${p.id}" type="number" value="${s.qty??0}"></td><td><input data-min="${p.id}" type="number" value="${s.min??0}"></td><td><span class="status ${s.code?'ok':''}">${s.code?'Cadastrado':'Pendente'}</span></td></tr>`}).join('');$('stockTable').innerHTML=`<table class="table"><thead><tr><th>Produto</th><th>Unidade</th><th>Código/EAN</th><th>Saldo</th><th>Mínimo</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;document.querySelectorAll('[data-code]').forEach(i=>i.onchange=()=>{stock[i.dataset.code]={...(stock[i.dataset.code]||{}),code:i.value.trim()};saveStock()});document.querySelectorAll('[data-qty]').forEach(i=>i.onchange=()=>{stock[i.dataset.qty]={...(stock[i.dataset.qty]||{}),qty:Number(i.value||0)};saveStock()});document.querySelectorAll('[data-min]').forEach(i=>i.onchange=()=>{stock[i.dataset.min]={...(stock[i.dataset.min]||{}),min:Number(i.value||0)};saveStock()});$('stockProducts').textContent=catalog.length;$('stockCodes').textContent=catalog.filter(p=>stock[p.id]?.code).length;$('stockLow').textContent=catalog.filter(p=>Number(stock[p.id]?.qty||0)<=Number(stock[p.id]?.min||0)&&Number(stock[p.id]?.min||0)>0).length;$('stockPending').textContent=catalog.filter(p=>!stock[p.id]?.code).length}function renderProduction(){const rows=catalog.filter(p=>['Pães','Salgados','Doces'].includes(p.category)).map(p=>`<tr><td>${p.name}</td><td>${p.unit}</td><td><input data-plan="${p.id}" type="number" min="0" value="${production[p.id]||0}"></td><td><span class="status ${production[p.id]>0?'ok':''}">${production[p.id]>0?'Planejado':'Sem plano'}</span></td></tr>`).join('');$('productionTable').innerHTML=`<table class="table"><thead><tr><th>Produto</th><th>Unidade</th><th>Planejado</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;document.querySelectorAll('[data-plan]').forEach(i=>i.onchange=()=>{production[i.dataset.plan]=Number(i.value||0);localStorage.setItem('padoka_demo_production',JSON.stringify(production));toast('Produção atualizada')})}function renderLoss(){if(!$('lossProduct').options.length)$('lossProduct').innerHTML=catalog.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');$('lossList').innerHTML=losses.length?losses.slice().reverse().map(x=>`<div class="notice"><strong>${x.product}</strong> • ${x.qty} • ${x.reason}<br>${x.note||''}</div>`).join(''):'<div class="notice">Nenhuma perda registrada.</div>'}function renderReports(){$('rProducts').textContent=catalog.length;$('rWeight').textContent=catalog.filter(p=>String(p.unit).includes('100')).length;$('rLoss').textContent=losses.length;$('rCodes').textContent=catalog.filter(p=>stock[p.id]?.code).length}$('prodSearch').oninput=renderProducts;$('lossSave').onclick=()=>{const p=catalog.find(x=>x.id===$('lossProduct').value);losses.push({product:p?.name||'Produto',qty:$('lossQty').value,reason:$('lossReason').value,note:$('lossNote').value});localStorage.setItem('padoka_demo_losses',JSON.stringify(losses));renderLoss();renderReports();toast('Perda registrada')};$('cfgSave').onclick=()=>{localStorage.setItem('padoka_demo_config',JSON.stringify({open:$('cfgOpen').value,close:$('cfgClose').value,night:$('cfgNight').value,payment:$('cfgPayment').value,note:$('cfgNote').value}));toast('Configurações salvas')};syncNav();drawTabs();renderProducts();renderStock();renderProduction();renderLoss();renderReports();</script></body></html>
